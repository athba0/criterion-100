<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>100 Essential Criterion Films</title>
<style>
:root {
  --bg: #0f1115;
  --card: #181b21;
  --text: #e6e6e6;
  --muted: #9aa0a6;
  --accent: #ff6f3c;
  --accent2: #ff9f1c;
  --watched: #2e7d32;
  --border: #2a2e36;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
}
header {
  padding: 2rem 1rem;
  text-align: center;
  background: linear-gradient(135deg, #1a1d23 0%, #0f1115 100%);
  border-bottom: 1px solid var(--border);
}
h1 { margin: 0 0 .5rem; font-size: 1.8rem; }
.subtitle { color: var(--muted); font-size: .95rem; }
.stats {
  display: flex;
  justify-content: center;
  gap: 1.5rem;
  margin-top: 1rem;
  font-size: .9rem;
}
.stat strong { color: var(--accent2); }
.controls {
  max-width: 900px;
  margin: 1.5rem auto 0;
  display: flex;
  gap: .75rem;
  flex-wrap: wrap;
  justify-content: center;
  padding: 0 1rem;
}
input, select, button {
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--text);
  padding: .6rem .8rem;
  border-radius: 8px;
  font: inherit;
}
input { min-width: 220px; }
button { cursor: pointer; transition: background .15s; }
button:hover { background: #22262e; }
.grid {
  max-width: 1100px;
  margin: 2rem auto;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 1rem;
  padding: 0 1rem 3rem;
}
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 1rem;
  display: flex;
  gap: 1rem;
  align-items: flex-start;
  transition: transform .1s, border-color .1s;
}
.card:hover { border-color: var(--accent); transform: translateY(-2px); }
.card.watched { opacity: .55; border-color: var(--watched); }
.card.watched .check-btn { background: var(--watched); border-color: var(--watched); }
.check-btn {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 2px solid var(--muted);
  background: transparent;
  color: transparent;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  cursor: pointer;
  padding: 0;
}
.check-btn:hover { border-color: var(--accent2); }
.card.watched .check-btn { color: #fff; }
.poster {
  width: 74px;
  height: 108px;
  object-fit: cover;
  border-radius: 6px;
  flex-shrink: 0;
  border: 1px solid var(--border);
  background: #23272f;
}
.info { flex: 1; }
.title { font-weight: 700; font-size: 1.05rem; margin: 0 0 .2rem; }
.meta { color: var(--muted); font-size: .85rem; margin-bottom: .5rem; }
.meta span:not(:last-child)::after { content: " • "; color: #555; }
.tags { display: flex; flex-wrap: wrap; gap: .35rem; }
.tag {
  font-size: .72rem;
  background: #23272f;
  padding: .2rem .5rem;
  border-radius: 99px;
  color: var(--muted);
}
.price { color: var(--accent2); font-weight: 600; }
.plot-toggle {
  background: none; border: none; color: var(--accent); font: inherit;
  font-size: .8rem; cursor: pointer; padding: 0; margin-top: .5rem;
}
.plot-toggle:hover { text-decoration: underline; }
.plot {
  display: none;
  margin-top: .5rem;
  font-size: .83rem;
  color: var(--muted);
  line-height: 1.45;
}
.plot.open { display: block; }
.links { margin-top: .6rem; }
.links a {
  font-size: .8rem;
  color: var(--accent);
  text-decoration: none;
  margin-right: .75rem;
}
.links a:hover { text-decoration: underline; }
.empty {
  text-align: center;
  color: var(--muted);
  padding: 3rem 1rem;
  grid-column: 1 / -1;
}
footer {
  text-align: center;
  color: var(--muted);
  font-size: .8rem;
  padding: 2rem 1rem;
  border-top: 1px solid var(--border);
}
</style>
</head>
<body>
<header>
  <h1>🎬 100 Essential Criterion Films</h1>
  <div class="subtitle">A curated starter list of the most recommended films in the Criterion Collection.</div>
  <div class="stats">
    <div class="stat">Watched: <strong id="watched-count">0</strong> / <strong id="total-count">0</strong></div>
    <div class="stat">Remaining: <strong id="remaining-count">0</strong></div>
  </div>
</header>

<div class="controls">
  <input type="text" id="search" placeholder="Search title or director...">
  <select id="filter">
    <option value="all">All</option>
    <option value="unwatched">Unwatched</option>
    <option value="watched">Watched</option>
  </select>
  <select id="sort">
    <option value="rank">Sort by rank</option>
    <option value="year">Sort by year</option>
    <option value="title">Sort by title</option>
    <option value="price">Sort by price (cheapest)</option>
  </select>
  <button id="reset">Reset watched</button>
</div>

<main class="grid" id="grid"></main>

<footer>Film info, posters, and synopses sourced from criterion.com. Prices are live Amazon listings (fluctuate daily). Where-to-watch via JustWatch.</footer>

<script>
const films = [
  { rank: 1, title: "Seven Samurai", director: "Akira Kurosawa", year: 1954, country: "Japan", genre: "Action/Drama", runtime: 207, criterion: "https://www.criterion.com/films/165-seven-samurai", poster: "https://s3.amazonaws.com/criterion-production/films/9d76c0395d994bbb7f9d6f7573796046/cThjxLEYjspgZR4c4TW7itGGxqawj8_medium.jpg", price: 24.99, amazon: "https://www.amazon.com/dp/B003KGBISY", plot: "One of the most thrilling movie epics of all time, Seven Samurai (Shichinin no samurai) tells the story of a sixteenth-century village whose desperate inhabitants hire the eponymous war\u00adriors to protect them from invading bandits. This three-hour-plus ride from Akira Kurosawa\u2014featuring legendary actors Toshiro Mifune and Takashi Shimura\u2014seamlessly weaves philosophy and enter\u00adtainment, delicate human emotions and relentless action, into a rich, evocative, and unforgettable tale of courage and hope." },
  { rank: 2, title: "The 400 Blows", director: "Fran\u00e7ois Truffaut", year: 1959, country: "France", genre: "Drama", runtime: 99, criterion: "https://www.criterion.com/films/151-the-400-blows", poster: "https://s3.amazonaws.com/criterion-production/films/6419fdfbf3442b70b449e2780ae6ac04/Jli0DzbsLXV9c4V1sPirW4n2Lw5FR8_medium.jpg", price: 19.99, amazon: "https://www.amazon.com/dp/B01M31SJY3", plot: "Fran\u00e7ois Truffaut\u2019s first feature is also his most personal. Told through the eyes of Truffaut\u2019s cinematic counterpart, Antoine Doinel (Jean-Pierre L\u00e9aud), The 400 Blows sensitively recreates the trials of Truffaut\u2019s own difficult childhood. The film established Truffaut as a trailblazing auteur of the French New Wave." },
  { rank: 3, title: "8\u00bd", director: "Federico Fellini", year: 1963, country: "Italy", genre: "Drama/Fantasy", runtime: 138, criterion: "https://www.criterion.com/films/150-8-1-2", poster: "https://s3.amazonaws.com/criterion-production/films/493b486a4800738de5b4a72bc82f5bf6/M927Tfj7NJo0gkNc16joRLIvwtnhaV_medium.jpg", plot: "Marcello Mastroianni plays Guido Anselmi, a director whose new project is collapsing around him, along with his life. One of the greatest films about film ever made, Federico Fellini\u2019s 8\u00bd (Otto e mezzo) turns one man\u2019s artistic crisis into a grand epic of the cinema. An early working title for 8\u00bd was The Beautiful Confusion, and Fellini\u2019s masterpiece is exactly that: a shimmering dream, a circus, and a magic act. Also featured is Fellini\u2019s rarely seen first film for television, Fellini: A Director\u2019s Notebook (1969). Produced by Peter Goldfarb, this \u201cimagined documentary\u201d of Fellini on Fellini is a kaleidoscope of unfinished projects, all of which provide a fascinating and candid window into the director\u2019s unique creative process." },
  { rank: 4, title: "Breathless", director: "Jean-Luc Godard", year: 1960, country: "France", genre: "Crime/Romance", runtime: 90, criterion: "https://www.criterion.com/films/268-breathless", poster: "https://s3.amazonaws.com/criterion-production/films/cbbba20dd4d6cc66800de5b92278ce57/LsVjs5RCEvtZRI65Qd3c2XJk1mhCxa_medium.jpg", price: 82.73, amazon: "https://www.amazon.com/dp/B01KGR17ZS", plot: "There was before Breathless, and there was after Breathless. Jean-Luc Godard burst onto the film scene in 1960 with this jazzy, free-form, and sexy homage to the American film genres that inspired him as a writer for Cahiers du cin\u00e9ma. With its lack of polish, surplus of attitude, anything-goes crime narrative, and effervescent young stars Jean-Paul Belmondo and Jean Seberg, Breathless helped launch the French New Wave and ensured that cinema would never be the same." },
  { rank: 5, title: "Rashomon", director: "Akira Kurosawa", year: 1950, country: "Japan", genre: "Drama/Mystery", runtime: 88, criterion: "https://www.criterion.com/films/307-rashomon", poster: "https://s3.amazonaws.com/criterion-production/films/21d6c647d6b04343bcb9a475c8bf161e/mCz7xlfXoonwsP48ZmChNuVOxzzHRT_medium.jpg", price: 19.99, amazon: "https://www.amazon.com/dp/B008Y5OWO8", plot: "A riveting psychological thriller that investigates the nature of truth and the meaning of justice, Rashomon is widely considered one of the greatest films ever made. Four people give different accounts of a man\u2019s murder and the rape of his wife, which director Akira Kurosawa presents with striking imagery and an ingenious use of flashbacks. This eloquent masterwork and international sensation revolutionized film language and introduced Japanese cinema\u2014and a commanding new star by the name of Toshiro Mifune\u2014to the Western world. Rashomon was restored by the Academy Film Archive, the National Film Center of the National Museum of Modern Art, Tokyo, and Kadokawa Pictures, Inc. Funding provided by Kadokawa Culture Promotion Foundation and The Film Foundation." },
  { rank: 6, title: "The Rules of the Game", director: "Jean Renoir", year: 1939, country: "France", genre: "Comedy/Drama", runtime: 110, criterion: "https://www.criterion.com/films/295-the-rules-of-the-game", poster: "https://s3.amazonaws.com/criterion-production/films/abd9ca329347cdfa920a9df9befc8128/IHCPc1PSyc10H2Um4kNrtHawCYtiAS_medium.jpg", price: 39.24, amazon: "https://www.amazon.com/dp/B0BYLC49KH", plot: "Considered one of the greatest films ever made, Jean Renoir\u2019s The Rules of the Game is a scathing critique of corrupt French society cloaked in a comedy of manners in which a weekend at a marquis\u2019s country ch\u00e2teau lays bare some ugly truths about a group of haut-bourgeois acquaintances. The film has had a tumultuous history: it was subjected to cuts after the violent response of the audience at its 1939 premiere, and the original negative was destroyed during World War II; it wasn\u2019t reconstructed until 1959. That version, which has stunned viewers for decades, is presented here." },
  { rank: 7, title: "Persona", director: "Ingmar Bergman", year: 1966, country: "Sweden", genre: "Drama/Thriller", runtime: 83, criterion: "https://www.criterion.com/films/28491-persona", poster: "https://s3.amazonaws.com/criterion-production/films/d5c135c95f58e74e2ee28cb92659bafd/DoD5SlisIFjKyi0zucupnwj2B3ADGy_medium.jpg", price: 19.99, amazon: "https://www.amazon.com/dp/B00HE011DE", plot: "By the midsixties, Ingmar Bergman had already conjured many of the cinema\u2019s most unforgettable images. But with the radical Persona, he attained new levels of visual poetry. In the first of a series of legendary performances for Bergman, Liv Ullmann plays a stage actor who has inexplicably gone mute; an equally mesmerizing Bibi Andersson is the garrulous young nurse caring for her in a remote island cottage. While isolated together there, the women undergo a mysterious spiritual and emotional transference. Performed with astonishing nuance and shot in stark contrast and soft light by Sven Nykvist, the influential Persona is a penetrating, dreamlike work of profound psychological depth." },
  { rank: 8, title: "The Seventh Seal", director: "Ingmar Bergman", year: 1957, country: "Sweden", genre: "Drama/Fantasy", runtime: 96, criterion: "https://www.criterion.com/films/173-the-seventh-seal", poster: "https://s3.amazonaws.com/criterion-production/films/6fede1f031c07b843ffa8965d47043f3/9QWkE37UXlpfhZrTIsaZHdWmooGJ1a_medium.jpg", price: 43.99, amazon: "https://www.amazon.com/dp/B0BSK73PVW", plot: "Returning exhausted from the Crusades to find medieval Sweden gripped by the Plague, a knight (Max von Sydow) suddenly comes face-to-face with the hooded figure of Death, and challenges him to a game of chess. As the fateful game progresses, and the knight and his squire encounter a gallery of outcasts from a society in despair, Ingmar Bergman mounts a profound inquiry into the nature of faith and the torment of mortality. One of the most influential films of its time, The Seventh Seal is a stunning allegory of man\u2019s search for meaning and a work of stark visual poetry." },
  { rank: 9, title: "Tokyo Story", director: "Yasujir\u014d Ozu", year: 1953, country: "Japan", genre: "Drama", runtime: 136, criterion: "https://www.criterion.com/films/284-tokyo-story", poster: "https://s3.amazonaws.com/criterion-production/films/1b44282b21475545ef56e2aea1b0b19f/LZF1cBQOkP5xsioO5gvLA3sqEk7g0y_medium.jpg", price: 32.28, amazon: "https://www.amazon.com/dp/B019WMTWJ6", plot: "A profoundly stirring evocation of elemental humanity and universal heartbreak, Tokyo Story is the crowning achievement of the unparalleled Yasujiro Ozu. The film, which follows an aging couple\u2019s journey to visit their grown children in bustling postwar Tokyo, surveys the rich and complex world of family life with the director\u2019s customary delicacy and incisive perspective on social mores. Featuring lovely performances from Ozu regulars Chishu Ryu and Setsuko Hara, Tokyo Story plumbs and deepens the director\u2019s recurring theme of generational conflict, creating what is without question one of cinema\u2019s mightiest masterpieces." },
  { rank: 10, title: "The Bicycle Thief", director: "Vittorio De Sica", year: 1948, country: "Italy", genre: "Drama", runtime: 89, criterion: "https://www.criterion.com/films/210-bicycle-thieves", poster: "https://s3.amazonaws.com/criterion-production/films/a020c4272223b01fa84782ca7f80ef3b/EtDUUmNY6vAX9TcTq0uRKG4BVqToH3_medium.jpg", price: 23.99, amazon: "https://www.amazon.com/dp/B07NG74GJ4", plot: "Hailed around the world as one of the greatest movies ever made, the Academy Award\u2013winning Bicycle Thieves, directed by Vittorio De Sica, defined an era in cinema. In poverty-stricken postwar Rome, a man is on his first day of a new job that offers hope of salvation for his desperate family when his bicycle, which he needs for work, is stolen. With his young son in tow, he sets off to track down the thief. Simple in construction and profoundly rich in human insight, Bicycle Thieves embodies the greatest strengths of the Italian neorealist movement: emotional clarity, social rectitude, and brutal honesty." },
  { rank: 11, title: "Mulholland Drive", director: "David Lynch", year: 2001, country: "USA", genre: "Mystery/Thriller", runtime: 147, criterion: "https://www.criterion.com/films/28050-mulholland-dr", poster: "https://s3.amazonaws.com/criterion-production/films/dfdd32ea78dc954d8cef1b54e34acbf0/sCfUtouYZPKwTEfBNRMEntUVk572AT_medium.jpg", plot: "A love story in the city of dreams . . . Blonde Betty Elms (Naomi Watts) has only just arrived in Hollywood to become a movie star when she meets an enigmatic brunette with amnesia (Laura Harring). Meanwhile, as the two set off to solve the second woman\u2019s identity, filmmaker Adam Kesher (Justin Theroux) runs into ominous trouble while casting his latest project. David Lynch\u2019s seductive and scary vision of Los Angeles\u2019s dream factory is one of the true masterpieces of the new millennium, a tale of love, jealousy, and revenge like no other." },
  { rank: 12, title: "In the Mood for Love", director: "Wong Kar-wai", year: 2000, country: "Hong Kong", genre: "Romance/Drama", runtime: 98, criterion: "https://www.criterion.com/films/198-in-the-mood-for-love", poster: "https://s3.amazonaws.com/criterion-production/films/a3541a5f0da15d52f1e0698447349d88/0xRtJdrJILjqJQKskAYnvPQxoKCXn8_medium.jpg", price: 39.24, amazon: "https://www.amazon.com/dp/B0B9ZCG5BY", plot: "Hong Kong, 1962: Chow Mo-Wan (Tony Leung Chiu Wai) and Su Li-Zhen (Maggie Cheung Man Yuk) move into neighboring apartments on the same day. Their encounters are formal and polite\u2014until a discovery about their spouses creates an intimate bond between them. At once delicately mannered and visually extravagant, Wong Kar Wai\u2019s In the Mood for Love is a masterful evocation of romantic longing and fleeting moments. With its aching soundtrack and exquisitely abstract cinematography by Christopher Doyle and Mark Lee Ping Bing, this film has been a major stylistic influence on the past two decades of cinema, and is a milestone in Wong\u2019s redoubtable career." },
  { rank: 13, title: "Stalker", director: "Andrei Tarkovsky", year: 1979, country: "Soviet Union", genre: "Sci-Fi/Drama", runtime: 162, criterion: "https://www.criterion.com/films/28150-stalker", poster: "https://s3.amazonaws.com/criterion-production/films/a2edcc26e1eab799429c48ff7067cee7/E0TPdmb6xXiqaiuPmArJq90hdAs3xV_medium.jpg", price: 32.28, amazon: "https://www.amazon.com/dp/B06ZY641YQ", plot: "Andrei Tarkovsky\u2019s final Soviet feature is a metaphys\u00adical journey through an enigmatic postapocalyptic landscape, and a rarefied cinematic experience like no other. A hired guide\u2014the Stalker\u2014leads a writer and a professor into the heart of the Zone, the restricted site of a long-ago disaster, where the three men eventually zero in on the Room, a place rumored to fulfill one\u2019s most deeply held desires. Adapting a science-fiction novel by Arkady and Boris Strugatsky, Tarkovsky created an immersive world with a wealth of material detail and a sense of organic atmosphere. A religious allegory, a reflection of contemporaneous political anxieties, a meditation on film itself\u2014Stalker envelops the viewer by opening up a multitude of possible meanings." },
  { rank: 14, title: "Solaris", director: "Andrei Tarkovsky", year: 1972, country: "Soviet Union", genre: "Sci-Fi/Drama", runtime: 166, criterion: "https://www.criterion.com/films/553-solaris", poster: "https://s3.amazonaws.com/criterion-production/films/647527e5987ba1f01e714df49e95acdb/caQS8NJz8DXvLNcdgnxxZJn7pZtC6l_medium.jpg", price: 32.28, amazon: "https://www.amazon.com/dp/B004NWPY34", plot: "Ground control has been receiving mysterious transmissions from the three remaining residents of the Solaris space station. When cosmonaut and psychologist Kris Kelvin is dispatched to investigate, he experiences the same strange phenomena that afflict the Solaris crew, sending him on a voyage into the darkest recesses of his consciousness. With Solaris, the legendary Russian filmmaker Andrei Tarkovsky created a brilliantly original science-fiction epic that challenges our conceptions about love, truth, and humanity itself." },
  { rank: 15, title: "Mirror", director: "Andrei Tarkovsky", year: 1975, country: "Soviet Union", genre: "Drama", runtime: 107, criterion: "https://www.criterion.com/films/28894-mirror", poster: "https://s3.amazonaws.com/criterion-production/films/729ba8bd7f066bab750d2fe963d37a77/AkLHyvTrDxSGVlvGaZdkHkuH9fSd0x_medium.jpg", price: 25.33, amazon: "https://www.amazon.com/dp/B092NQXD1L", plot: "A subtly ravishing passage through the halls of time and memory, this sublime reflection on twentieth-century Russian history by Andrei Tarkovsky (Stalker) is as much a poem composed in images, or a hypnagogic hallucination, as it is a work of cinema. In a richly textured collage of varying film stocks and newsreel footage, the recollections of a dying poet flash before our eyes, his dreams mingling with scenes of childhood, wartime, and marriage, all imbued with the mystical power of a trance. Largely dismissed by Soviet critics on its release because of its elusive narrative structure, Mirror has since taken its place as one of the director\u2019s most renowned and influential works, a stunning personal statement from an artist transmitting his innermost thoughts and feelings directly from psyche to screen." },
  { rank: 16, title: "Aguirre, the Wrath of God", director: "Werner Herzog", year: 1972, country: "West Germany", genre: "Adventure/Drama", runtime: 95, plot: "On Christmas Day, 1560, several scores of Spanish conquistadors under Gonzalo Pizarro and two hundred native slaves march down from the newly conquered Inca Empire into the Amazon rainforest in search of the fabled El Dorado. The men, clad in half armor, pull cannons down narrow mountain paths and through dense, muddy jungle.\nOn New Year's Eve, Pizarro orders a group of forty men to build rafts and scout down the river. If they do not return to the main party within one week with news of what lies beyond, they will be considered lost. Pizarro chooses Don Pedro de Urs\u00faa as the commander of the expedition, Don Lope de Aguirre as his second-in-command, portly nobleman Don Fernando de Guzm\u00e1n to represent the Spanish crown, and Brother Gaspar de Carvajal to bring the word of God. Accompanying the expedition, against Pizarro's better judgment, are Urs\u00faa's mistress, Do\u00f1a In\u00e9s, and Aguirre's teenage daughter Flores.\nOne of the four rafts gets caught in an eddy while traveling through river rapids, and the others are unable to help free it. That night, gunfire erupts on the trapped raft; in the morning, the men on board are found slain by arrows from Indigenous tribesmen, with three missing. Urs\u00faa wants the bodies to be brought back to camp for burial. Knowing this would slow down the expedition, Aguirre suggests to a soldier, Perucho, that the cannon is rusty and needs firing. Perucho aims at the raft, destroying it and abandoning the bodies in the river.\nDuring the night, the remaining rafts are swept miles off course by the rising river. Time has run out for the scouting mission, and Urs\u00faa decides that they must return to Pizarro's camp. Aguirre leads a mutiny against Urs\u00faa, telling the men that untold riches await them ahead, and reminding them that Hern\u00e1n Cort\u00e9s won an empire in Mexico by disobeying orders. Urs\u00faa orders Aguirre arrested but is shot and restrained by the mutineers. Aguirre nominates Guzm\u00e1n as the new leader of the expedition and has his men renounce their loyalty to the Crown, proclaiming Guzm\u00e1n \"emperor\" of El Dorado. Urs\u00faa is sentenced to death in a show trial but  Guzm\u00e1n unexpectedly commutes the sentence.\nAguirre remains the true leader of the mutiny, so oppressive and terrifying that few protest his leadership. Only In\u00e9s has the courage to speak out against him. Knowing that some of the soldiers are still loyal to Urs\u00faa, Aguirre ignores her. The expedition breaks up the rafts to make a single large one and continues on downriver. \nAn Indigenous couple approaching peacefully by canoe are captured by the explorers, and when the man expresses confusion upon being presented with a Bible, Carvajal personally kills them for blasphemy. Guzm\u00e1n insists on being fed first while the other men starve and has the expedition's only remaining horse pushed off the raft because it annoys him; soon afterwards he is found dead near the raft's privy. Aguirre proclaims himself leader and has Urs\u00faa taken ashore to be hanged. He orders an attack on an Indigenous village to obtain food, resulting in several men being killed. The distraught In\u00e9s walks into the jungle and disappears.\nOn the raft, the group of slowly starving, feverish men begin disbelieving everything they see even as arrows are fired at them. The group stares in disbelief at a wooden ship perched in the highest branches of a tall tree. Aguirre orders that it be brought down and refurbished, but Carvajal refuses. In a series of attacks by unseen assailants, all of the remaining crew except Aguirre, including Flores, are shot dead with arrows. Monkeys overrun the raft as Aguirre deliriously imagines conquering the New World and founding an incestuous dynasty with his slain daughter. Picking up a monkey, he asks, \"Who else is with me?\"" },
  { rank: 17, title: "Fitzcarraldo", director: "Werner Herzog", year: 1982, country: "West Germany", genre: "Adventure/Drama", runtime: 158, plot: "In the early part of the 20th century, Iquitos, Peru, a small city on the Upper Amazon, is experiencing rapid growth due to a rubber boom. One incomer, an Irishman named Brian Sweeney Fitzgerald (known locally as \"Fitzcarraldo\"), is a lover of opera and a great fan of the internationally renowned Italian tenor Enrico Caruso. He dreams of building an opera house in Iquitos, but, although he has an indomitable spirit, he has little capital. The Peruvian government has parceled up the areas in the Amazon basin known to contain rubber trees. However, the best parcels having already been leased to private companies for exploitation, Fitzcarraldo has been trying and failing to make the money to bring opera to Iquitos by various other means, including an ambitious attempt to construct a Trans-Andean Railway.\nA rubber baron shows Fitzcarraldo a map and explains that, while the only remaining unclaimed parcel in the area is on the Ucayali River, a major tributary of the Amazon, it is cut off from the Amazon (and access to Atlantic ports) by a lengthy section of rapids. Fitzcarraldo notices that the Pachitea River, another Amazon tributary, comes within several hundred meters of the Ucayali upstream of the parcel. He leases the inaccessible parcel from the government, and his paramour, Molly, a successful brothel owner, funds his purchase of an old steamship, which he christens the SS Molly Aida, from the rubber baron. After fixing up the boat, Fitzcarraldo recruits a crew and takes off up the Pachitea, which is largely unexplored because of the hostile Indians who live on its banks.\nFitzcarraldo intends to go to the closest point between the Pachitea and the Ucayali, pull his three-deck, 320-ton steamship up the muddy 40\u00b0 hillside, and portage it from one river to the next. He plans to use the ship to collect rubber harvested along the Ucayali and then transport the rubber over to the Pachitea and, on different ships, down to market at Atlantic ports.\nSoon after they enter Indian territory, the majority of Fitzcarraldo's crew, who are unaware of his full plan, abandon the expedition, leaving only the captain, engineer, and cook. The natives are impressed by the steamship and, once they make contact, agree to help Fitzcarraldo without asking many questions. After months of work and great struggles, they successfully pull the ship over the mountain using a complex system of pulleys aided by the ship's anchor windlass. The crew falls asleep after a drunken celebration, and the chief of the natives severs the rope securing the ship to the shore. Fitzcarraldo awakens as the boat is entering the rapids, and is unable to stop it. The ship does not sustain any major damage, but Fitzcarraldo is forced to abandon his quest. Before returning to Iquitos, he learns that the natives helped him move the ship in the belief that sending it over the Ucayali rapids would appease the spirits dwelling there.\nDespondent, Fitzcarraldo sells the steamship back to the rubber baron, but there is time before the title changes hands for him to send for a European opera company that he is told is in Manaus. Lacking an opera house, they construct their sets on the deck of the ship, and the entire city of Iquitos comes down to the riverbank to watch as Fitzcarraldo floats it by, managing to bring opera to the city after all." },
  { rank: 18, title: "The Passion of Joan of Arc", director: "Carl Theodor Dreyer", year: 1928, country: "France", genre: "Drama/History", runtime: 96, criterion: "https://www.criterion.com/films/228-the-passion-of-joan-of-arc", poster: "https://s3.amazonaws.com/criterion-production/films/bcbb15894d5dc7e551a08a16c1b35bc0/8wjCmfEsUYDCaRrqZIuYAVESsbelL4_medium.jpg", price: 32.28, amazon: "https://www.amazon.com/dp/B0788XV8ZM", plot: "Spiritual rapture and institutional hypocrisy come to stark, vivid life in one of the most transcendent masterpieces of the silent era. Chronicling the trial of Joan of Arc in the hours leading up to her execution, Danish master Carl Theodor Dreyer depicts her torment with startling immediacy, employing an array of techniques\u2014expressionistic lighting, interconnected sets, painfully intimate close-ups\u2014to immerse viewers in her subjective experience. Anchoring Dreyer\u2019s audacious formal experimentation is a legendary performance by Ren\u00e9e Falconetti, whose haunted face channels both the agony and the ecstasy of martyrdom." },
  { rank: 19, title: "The Cabinet of Dr. Caligari", director: "Robert Wiene", year: 1920, country: "Germany", genre: "Horror", runtime: 94, plot: "In what appears to be a park, Franzis sits on a bench with an older man who complains that spirits have driven him away from his family and home. When a dazed woman passes them, Franzis explains she is his fianc\u00e9e Jane and that they have suffered a great ordeal. Most of the rest of the film is a flashback of Franzis' story, which takes place in Holstenwall, a shadowy town of twisted buildings and spiraling streets. \nFranzis and his friend Alan, who are good-naturedly competing for Jane's affections, plan to visit the town fair. Meanwhile, a mysterious man named Dr. Caligari seeks a permit from the rude town clerk to present a spectacle at the fair, which features Cesare, a somnambulist. The clerk shouts at Caligari to wait, but ultimately approves the permit. That night, the clerk is stabbed to death in his bed.\nThe next morning, Franzis and Alan visit Caligari's sideshow attraction, where he opens a coffin-like box to reveal the sleeping Cesare. On Caligari's order, Cesare awakens and answers questions from the audience. Despite Franzis' protests, Alan asks, \"How long shall I live?\" To Alan's horror, Cesare answers, \"Until dawn tomorrow.\" Later that night, a figure breaks into Alan's home and stabs him to death in his bed. A grief-stricken Franzis investigates Alan's murder with help from Jane and her father, Dr. Olsen, who obtains police authorisation to investigate the somnambulist. That night, the police apprehend a criminal in possession of a knife who is caught attempting to murder an elderly woman. When questioned by Franzis and Dr. Olsen, the criminal confesses he tried to kill the elderly woman, but denies any part in the two previous deaths; he was merely taking advantage of the situation to divert blame away from himself.\nAt night, Franzis spies on Caligari and observes what appears to be Cesare sleeping in his box. However, the real Cesare sneaks into Jane's home as she sleeps. He raises a knife to stab her, but instead abducts her after a struggle, dragging her through the window onto the street. Chased by an angry mob, Cesare eventually drops Jane and flees; he soon collapses and dies of exhaustion. Franzis confirms that the criminal who confessed to the elderly woman's murder is still locked away and could not have been Jane's attacker. Franzis and the police investigate Caligari's sideshow and discover that the \"Cesare\" sleeping in the box is only a dummy. Caligari escapes in the confusion. Franzis follows him and sees Caligari go into an insane asylum.\nUpon further investigation, Franzis is shocked to learn that Caligari is the asylum's director. With help from the asylum staff, Franzis studies the director's records and diary while the director is sleeping. The writings reveal his obsession with the story of an 18th-century mystic named Caligari, who used a somnambulist named Cesare to commit murders in northern Italian towns. The director, attempting to understand the earlier Caligari, experiments on a somnambulist admitted to the asylum, who becomes his Cesare. The asylum director screams, \"I must become Caligari!\" After the flashback, Franzis and the doctors call the police to Caligari's office, where they show him Cesare's corpse. Caligari then attacks one of the staff. He is subdued, restrained in a straitjacket, and becomes an inmate in his own asylum.\nThe narrative returns to the present, where Franzis concludes his story. In a twist ending, Franzis is depicted as an asylum inmate. Jane and Cesare are patients as well; Jane believes that she is a queen, while Cesare is not a somnambulist but awake, quiet, and not visibly dangerous. The man Franzis refers to as \"Dr. Caligari\" is the asylum director. Franzis attacks him and is restrained in a straitjacket, then placed in the same cell where Caligari was confined in Franzis' story. The asylum director announces that he now understands Franzis's delusion, and that he is confident he can cure him." },
  { rank: 20, title: "La Dolce Vita", director: "Federico Fellini", year: 1960, country: "Italy", genre: "Drama/Comedy", runtime: 174, criterion: "https://www.criterion.com/films/28619-la-dolce-vita", poster: "https://s3.amazonaws.com/criterion-production/films/41271853307b3fb10334a7d2b51e41ce/pDxTYardFcKk8EIL1qgmAJ96A9zCTn_medium.jpg", price: 15.25, amazon: "https://www.amazon.com/dp/B09B1KHJTH", plot: "The biggest hit from the most popular Italian filmmaker of all time, La dolce vita rocketed Federico Fellini to international mainstream success\u2014ironically, by offering a damning critique of the culture of stardom. A look at the darkness beneath the seductive lifestyles of Rome\u2019s rich and glamorous, the film follows a notorious celebrity journalist (a sublimely cool Marcello Mastroianni) during a hectic week spent on the peripheries of the spotlight. This mordant picture was an incisive commentary on the deepening decadence of contemporary Europe, and it provided a prescient glimpse of just how gossip- and fame-obsessed our society would become." },
  { rank: 21, title: "Au Hasard Balthazar", director: "Robert Bresson", year: 1966, country: "France", genre: "Drama", runtime: 95, criterion: "https://www.criterion.com/films/455-au-hasard-balthazar", poster: "https://s3.amazonaws.com/criterion-production/films/3bfeccc88c1706a5dd401df39582d7cf/eM5j469VIjNvWJjFs4OGOnOpTBbpXJ_medium.jpg", price: 32.28, amazon: "https://www.amazon.com/dp/B079VF7PZP", plot: "A profound masterpiece from one of the most revered filmmakers in the history of cinema, Robert Bresson\u2019s Au hasard Balthazar follows the donkey Balthazar as he is passed from owner to owner, some kind and some cruel but all with motivations beyond his understanding. Balthazar, whose life parallels that of his first keeper, Marie, is truly a beast of burden, suffering the sins of humankind. But despite his powerlessness, he accepts his fate nobly. Through Bresson\u2019s unconventional approach to composition, sound, and narrative, this simple story becomes a moving parable about purity and transcendence." },
  { rank: 22, title: "Pickpocket", director: "Robert Bresson", year: 1959, country: "France", genre: "Crime/Drama", runtime: 76, criterion: "https://www.criterion.com/films/229-pickpocket", poster: "https://s3.amazonaws.com/criterion-production/films/0393b1514456110873c27c246596512a/RWW69Tp4DBKzuu2BSSd4Rh6MmATBXj_medium.jpg", price: 32.28, amazon: "https://www.amazon.com/dp/B0D3MBD83D", plot: "This incomparable story of crime and redemption from the French master Robert Bresson follows Michel, a young pickpocket who spends his days working the streets, subway cars, and train stations of Paris. As his compulsive pursuit of the thrill of stealing grows, however, so does his fear that his luck is about to run out. A cornerstone of the career of this most economical and profoundly spiritual of filmmakers, Pickpocket is an elegantly crafted, tautly choreographed study of humanity in all its mischief and grace, the work of a director at the height of his powers." },
  { rank: 23, title: "A Man Escaped", director: "Robert Bresson", year: 1956, country: "France", genre: "Drama/Thriller", runtime: 101, criterion: "https://www.criterion.com/films/27848-a-man-escaped", poster: "https://s3.amazonaws.com/criterion-production/films/a40ed687d5140180d4800050b1822fbf/WYZyuQWtipLuvNo5zcMjy9vFp9Bpze_medium.jpg", price: 19.99, amazon: "https://www.amazon.com/dp/B00AQ6J3AG", plot: "With the simplest of concepts and sparest of techniques, Robert Bresson made one of the most suspenseful jailbreak films of all time in A Man Escaped. Based on the account of an imprisoned French Resistance leader, this unbelievably taut and methodical marvel follows the fictional Fontaine\u2019s single-minded pursuit of freedom, detailing the planning and execution of his escape with gripping precision. But Bresson\u2019s film is not merely about process\u2014it\u2019s also a work of intense spirituality and humanity." },
  { rank: 24, title: "Contempt", director: "Jean-Luc Godard", year: 1963, country: "France", genre: "Drama/Romance", runtime: 103, criterion: "https://www.criterion.com/films/239-contempt", poster: "https://s3.amazonaws.com/criterion-production/films/cae208f094ecebe309725be4da77fc6a/2BtyOBtJSRO3DebbEvm5h4sRnya54Z_medium.jpg", price: 31.98, amazon: "https://www.amazon.com/dp/B00005JKPT", plot: "Jean-Luc Godard\u2019s subversive foray into commercial filmmaking is a star-studded Cinemascope epic. Contempt (Le M\u00e9pris) stars Michel Piccoli as a screenwriter torn between the demands of a proud European director (played by legendary director Fritz Lang), a crude and arrogant American producer (Jack Palance), and his disillusioned wife, Camille (Brigitte Bardot), as he attempts to doctor the script for a new film version of The Odyssey. The Criterion Collection is proud to present this brilliant study of marital breakdown, artistic compromise, and the cinematic process in a new special edition." },
  { rank: 25, title: "Band of Outsiders", director: "Jean-Luc Godard", year: 1964, country: "France", genre: "Crime/Drama", runtime: 95, criterion: "https://www.criterion.com/films/291-band-of-outsiders", poster: "https://s3.amazonaws.com/criterion-production/films/ae260bc49b38999ae5d987f2bac9aeab/Leo6yt5ZClpT2WA4trT7idTMnGhNug_medium.jpg", price: 32.28, amazon: "https://www.amazon.com/dp/B00BJB2GX8", plot: "Four years after Breathless, Jean-Luc Godard reimagined the gangster film even more radically with Band of Outsiders (Bande \u00e0 part). In it, two restless young men (Sami Frey and Claude Brasseur) enlist the object of both of their fancies (Anna Karina) to help them commit a robbery\u2014in her own home. This audacious and wildly entertaining French New Wave gem is at once sentimental and insouciant, effervescently romantic and melancholy, and it features some of Godard\u2019s most memorable set pieces, including the headlong race through the Louvre and the unshakably cool Madison dance sequence." },
  { rank: 26, title: "Jules and Jim", director: "Fran\u00e7ois Truffaut", year: 1962, country: "France", genre: "Drama/Romance", runtime: 105, criterion: "https://www.criterion.com/films/218-jules-and-jim", poster: "https://s3.amazonaws.com/criterion-production/films/98a574fceaf7129521ca226ad6781179/0r8k1qr8ovKte9kj3fQR1ji3nXxYG6_medium.jpg", price: 52.9, amazon: "https://www.amazon.com/dp/B00GPPXOTS", plot: "Hailed as one of the finest films ever made, Jules and Jim charts, over twenty-five years, the relationship between two friends and the object of their mutual obsession. The legendary Fran\u00e7ois Truffaut directs, and Jeanne Moreau stars as the alluring and willful Catherine, whose enigmatic smile and passionate nature lure Jules (Oskar Werner) and Jim (Henri Serre) into one of cinema\u2019s most captivating romantic triangles. An exuberant and poignant meditation on freedom, loyalty, and the fortitude of love, Jules and Jim was a worldwide smash in 1962 and remains every bit as audacious and entrancing today." },
  { rank: 27, title: "The Virgin Spring", director: "Ingmar Bergman", year: 1960, country: "Sweden", genre: "Drama", runtime: 89, criterion: "https://www.criterion.com/films/372-the-virgin-spring", poster: "https://s3.amazonaws.com/criterion-production/films/801e84275fd24d65ca5c0f42aac9d3e6/7Cd0pGdJRCLCu2KTtuANf8lBDlSPbs_medium.jpg", price: 19.99, amazon: "https://www.amazon.com/dp/B07BFBT37J", plot: "Winner of the Academy Award for best foreign-language film, Ingmar Bergman\u2019s The Virgin Spring is a harrowing tale of faith, revenge, and savagery in medieval Sweden. With austere simplicity, the director tells the story of the rape and murder of the virgin Karin, and her father T\u00f6re\u2019s ruthless pursuit of vengeance against the three killers. Starring Max von Sydow and photographed by the brilliant Sven Nykvist, the film is both beautiful and cruel in its depiction of a world teetering between paganism and Christianity." },
  { rank: 28, title: "Wild Strawberries", director: "Ingmar Bergman", year: 1957, country: "Sweden", genre: "Drama", runtime: 91, criterion: "https://www.criterion.com/films/175-wild-strawberries", poster: "https://s3.amazonaws.com/criterion-production/films/d78495b9e9da66ef9be05e719f19b2b1/xYBLfMNWYWncFNp2go7GJV1d7z75fh_medium.jpg", price: 18.99, amazon: "https://www.amazon.com/dp/B00BX49B0C", plot: "Traveling to accept an honorary degree, Professor Isak Borg\u2014masterfully played by the veteran filmmaker and actor Victor Sj\u00f6str\u00f6m\u2014is forced to face his past, come to terms with his faults, and make peace with the inevitability of his approaching death. Through flashbacks and fantasies, dreams and nightmares, Wild Strawberries dramatizes one man\u2019s remarkable voyage of self-discovery. This richly humane masterpiece, full of iconic imagery, is one of Ingmar Bergman\u2019s most widely acclaimed and influential films." },
  { rank: 29, title: "Late Spring", director: "Yasujir\u014d Ozu", year: 1949, country: "Japan", genre: "Drama", runtime: 108, criterion: "https://www.criterion.com/films/298-late-spring", poster: "https://s3.amazonaws.com/criterion-production/films/b36c368d289d0dead068cd8a35524d59/75M2sRH7tFJjp4gxf1QNvLDp3qA8CS_medium.jpg", price: 19.99, amazon: "https://www.amazon.com/dp/B006X96PBU", plot: "One of the most powerful of Yasujiro Ozu\u2019s family portraits, Late Spring (Banshun) tells the story of a widowed father who feels compelled to marry off his beloved only daughter. Eminent Ozu players Chishu Ryu and Setsuko Hara command this poignant tale of love and loss in postwar Japan, which remains as potent today as ever\u2014and a strong justification for its maker\u2019s inclusion in the pantheon of cinema\u2019s greatest directors." },
  { rank: 30, title: "Early Summer", director: "Yasujir\u014d Ozu", year: 1951, country: "Japan", genre: "Drama", runtime: 124, criterion: "https://www.criterion.com/films/875-early-summer", poster: "https://s3.amazonaws.com/criterion-production/films/0cbd8206128eb5051258b6505fdc6f6c/7NJvtBPD2HpxCAqOqMfHzaGVo0dIwL_medium.jpg", price: 19.99, amazon: "https://www.amazon.com/dp/B00026L7MC", plot: "The Mamiya family is seeking a husband for their daughter, Noriko, but she has ideas of her own. Played by the extraordinary Setsuko Hara, Noriko impulsively chooses her childhood friend, at once fulfilling her family's desires while tearing them apart. A seemingly simple story, Early Summer is one of Yasujiro Ozu's most complex works\u2014a nuanced examination of life's changes across three generations. The Criterion Collection is proud to present one of the director's most enduring classics." },
  { rank: 31, title: "An Autumn Afternoon", director: "Yasujir\u014d Ozu", year: 1962, country: "Japan", genre: "Drama", runtime: 113, criterion: "https://www.criterion.com/films/784-an-autumn-afternoon", poster: "https://s3.amazonaws.com/criterion-production/films/a8ea8ea6c23887c9172372d22d52a87a/L1PCM8Z0TUWLZ3RLdDMcMOOvKvPGl2_medium.jpg", price: 34.95, amazon: "https://www.amazon.com/dp/B001BEK8CE", plot: "The last film by Yasujiro Ozu was also his final masterpiece, a gently heartbreaking story about a man\u2019s dignified resignation to life\u2019s shifting currents and society\u2019s modernization. Though the widower Shuhei (frequent Ozu leading man Chishu Ryu) has been living comfortably for years with his grown daughter, a series of events leads him to accept and encourage her marriage and departure from their home. As elegantly composed and achingly tender as any of the Japanese master\u2019s films, An Autumn Afternoon is one of cinema\u2019s fondest farewells." },
  { rank: 32, title: "Ran", director: "Akira Kurosawa", year: 1985, country: "Japan", genre: "Action/Drama", runtime: 162, criterion: "https://www.criterion.com/films/754-ran", poster: "https://s3.amazonaws.com/criterion-production/films/cf75c5b225b8892c55ed98276db4f5ce/MwHT6SDYJSbktYtorPE6MOO8mE3UtI_medium.jpg", price: 95.0, amazon: "https://www.amazon.com/dp/B000BB14YY", plot: "With Ran, legendary director Akira Kurosawa reimagines Shakespeare's King Lear as a singular historical epic set in sixteenth-century Japan. Majestic in scope, the film is Kurosawa's late-life masterpiece, a profound examination of the folly of war and the crumbling of one family under the weight of betrayal, greed, and the insatiable thirst for power." },
  { rank: 33, title: "Yojimbo", director: "Akira Kurosawa", year: 1961, country: "Japan", genre: "Action/Drama", runtime: 110, criterion: "https://www.criterion.com/films/597-yojimbo", poster: "https://s3.amazonaws.com/criterion-production/films/dc441ab4f6b0d44cf707134b8ae1325d/tMu5TTGWBbqEmbECQj7frKx6s0NVpj_medium.jpg", price: 34.99, amazon: "https://www.amazon.com/dp/B003152Z4U", plot: "The incomparable Toshiro Mifune stars in Akira Kurosawa\u2019s visually stunning and darkly comic Yojimbo. To rid a terror-stricken village of corruption, wily masterless samurai Sanjuro turns a range war between two evil clans to his own advantage. Remade twice, by Sergio Leone and Walter Hill, this exhilarating genre-twister remains one of the most influential and entertaining films of all time." },
  { rank: 34, title: "Sanjuro", director: "Akira Kurosawa", year: 1962, country: "Japan", genre: "Action/Drama", runtime: 96, criterion: "https://www.criterion.com/films/598-sanjuro", poster: "https://s3.amazonaws.com/criterion-production/films/b08d3ba956d6ab8f255dc09cd25f837a/C4m0odkX7AeaHWex7uSgMPGxtpL8R9_medium.jpg", plot: "Toshiro Mifune swaggers and snarls to brilliant comic effect in Akira Kurosawa\u2019s tightly paced, beautifully composed Sanjuro. In this sly companion piece to Yojimbo, jaded samurai Sanjuro helps an idealistic group of young warriors weed out their clan\u2019s evil influences, and in the process turns their image of a \u201cproper\u201d samurai on its ear. Less brazen in tone than its predecessor but equally entertaining, this classic character\u2019s return is a masterpiece in its own right." },
  { rank: 35, title: "Ikiru", director: "Akira Kurosawa", year: 1952, country: "Japan", genre: "Drama", runtime: 143, criterion: "https://www.criterion.com/films/353-ikiru", poster: "https://s3.amazonaws.com/criterion-production/films/170a20632c3aaea17daab26fe62ae0b4/KEnmrGEhKGIUoIrMqG2vVjSk0nkr1h_medium.jpg", price: 14.99, amazon: "https://www.amazon.com/dp/B0141RBHSQ", plot: "One of the greatest achievements by Akira Kurosawa, Ikiru shows the director at his most compassionate\u2014affirming life through an explora\u00adtion of death. Takashi Shimura beautifully portrays Kanji Watanabe, an aging bureaucrat with stomach cancer who is impelled to find meaning in his final days. Presented in a radically conceived two\u00adpart structure and shot with a perceptive, humanistic clarity of vision, Ikiru is a multifaceted look at what it means to be alive." },
  { rank: 36, title: "High and Low", director: "Akira Kurosawa", year: 1963, country: "Japan", genre: "Crime/Drama", runtime: 143, criterion: "https://www.criterion.com/films/543-high-and-low", poster: "https://s3.amazonaws.com/criterion-production/films/e65763e6d1d83a962ab19a408bfda6eb/jl9963uFAEon5uv5zfWBbGjunRKJ7h_medium.jpg", price: 32.28, amazon: "https://www.amazon.com/dp/B004WPYO3I", plot: "Toshiro Mifune is unforgettable as Kingo Gondo, a wealthy industrialist whose family becomes the target of a cold-blooded kidnapper in High and Low, the highly influential domestic drama and police procedural from director Akira Kurosawa. Adapting Ed McBain\u2019s detective novel King\u2019s Ransom, Kurosawa moves effortlessly from compelling race-against-time thriller to exacting social commentary, creating a diabolical treatise on class and contemporary Japanese society." },
  { rank: 37, title: "Harakiri", director: "Masaki Kobayashi", year: 1962, country: "Japan", genre: "Action/Drama", runtime: 133, criterion: "https://www.criterion.com/films/743-harakiri", poster: "https://s3.amazonaws.com/criterion-production/films/fe65c912ed0121f71023506eb6cc23be/py4J44m9myctddWu0rfZeTZNdB7l4g_medium.jpg", plot: "Following the collapse of his clan, an unemployed samurai (Tatsuya Nakadai) arrives at the manor of Lord Iyi, begging to be allowed to commit ritual suicide on the property. Iyi\u2019s clansmen, believing the desperate ronin is merely angling for a new position, try to force his hand and get him to eviscerate himself\u2014but they have underestimated his beliefs and his personal brand of honor. Winner of the Cannes Film Festival\u2019s Special Jury Prize, Harakiri, directed by Masaki Kobayashi is a fierce evocation of individual agency in the face of a corrupt and hypocritical system." },
  { rank: 38, title: "Kwaidan", director: "Masaki Kobayashi", year: 1964, country: "Japan", genre: "Horror/Fantasy", runtime: 183, criterion: "https://www.criterion.com/films/629-kwaidan", poster: "https://s3.amazonaws.com/criterion-production/films/46814ce3abeb4b2311fb8543f8cccfc9/RxLBoxAZHDluyMr4dol7kupZYOuvpz_medium.jpg", price: 32.28, amazon: "https://www.amazon.com/dp/B011SDC1PY", plot: "After more than a decade of sober political dramas and socially minded period pieces, the great Japanese director Masaki Kobayashi shifted gears dramatically for this rapturously stylized quartet of ghost stories. Featuring colorfully surreal sets and luminous cinematography, these haunting tales of demonic comeuppance and spiritual trials, adapted from writer Lafcadio Hearn\u2019s collections of Japanese folklore, are existentially frightening and meticulously crafted. This version of Kwaidan is the original three-hour cut, never before released in the United States." },
  { rank: 39, title: "Woman in the Dunes", director: "Hiroshi Teshigahara", year: 1964, country: "Japan", genre: "Drama/Existential", runtime: 123, criterion: "https://www.criterion.com/films/826-woman-in-the-dunes", poster: "https://s3.amazonaws.com/criterion-production/films/98fca346151a9909ce777d3c7bcf4e14/NiN005MtaZLuhUJZOq7z7jOk0wRd02_medium.jpg", price: 19.99, amazon: "https://www.amazon.com/dp/B01FRMOXA8", plot: "One of the 1960s\u2019 great international art-house sensations, Woman in the Dunes (Suna no onna) was for many the grand unveiling of the surreal, idiosyncratic world of Hiroshi Teshigahara. Eiji Okada plays an amateur entomologist who has left Tokyo to study an unclassified species of beetle found in a vast desert. When he misses his bus back to civilization, he is persuaded to spend the night with a young widow (Kyoko Kishida) in her hut at the bottom of a sand dune. What results is one of cinema\u2019s most unnerving and palpably erotic battles of the sexes, as well as a nightmarish depiction of everyday life as a Sisyphean struggle\u2014an achievement that garnered Teshigahara an Academy Award nomination for best director." },
  { rank: 40, title: "The Face of Another", director: "Hiroshi Teshigahara", year: 1966, country: "Japan", genre: "Drama/Sci-Fi", runtime: 124, criterion: "https://www.criterion.com/films/828-the-face-of-another", poster: "https://s3.amazonaws.com/criterion-production/films/96aaa4852564c797f5a3eda2e58fd0a6/aGGt1C8WP6nmn3eJJIRKljOhzENnRi_medium.jpg", plot: "A staggering work of existential science fiction, The Face of Another dissects identity with the sure hand of a surgeon. Okuyama (Yojimbo's Tatsuya Nakadai), after being burned and disfigured in an industrial accident and estranged from his family and friends, agrees to his psychiatrist's radical experiment: a face transplant, created from the mold of a stranger. As Okuyama is thus further alienated from the world around him, he finds himself giving in to his darker temptations. With unforgettable imagery, Teshigahara's film explores both the limits and freedom in acquiring a new persona, and questions the notion of individuality itself." },
  { rank: 41, title: "Onibaba", director: "Kaneto Shindo", year: 1964, country: "Japan", genre: "Horror/Drama", runtime: 103, criterion: "https://www.criterion.com/films/665-onibaba", poster: "https://s3.amazonaws.com/criterion-production/films/e0fc371e56bef5749dc61aa890ad5d2e/GESrQUhGrAwZFXI5FVnOsR4gg0aiEj_medium.jpg", price: 19.99, amazon: "https://www.amazon.com/dp/B099LH3Y4J", plot: "Deep in the windswept marshes of war-torn medieval Japan, an impoverished older woman and her daughter-in-law murder lost samurai and sell their belongings for the most meager of sustenance. When a bedraggled neighbor returns from battle, lust, jealousy, and rage threaten to destroy the trio\u2019s tenuous existence, before an ominous, ill-gotten demon mask seals their horrifying fate. Driven by primal emotions, dark eroticism, a frenzied score by Hikaru Hayashi, and stunning images both lyrical and macabre, Kaneto Shindo\u2019s chilling folktale Onibaba conjures a nightmarish vision of humankind\u2019s deepest desires and impulses." },
  { rank: 42, title: "Night of the Hunter", director: "Charles Laughton", year: 1955, country: "USA", genre: "Thriller/Film Noir", runtime: 92, criterion: "https://www.criterion.com/films/27525-the-night-of-the-hunter", poster: "https://s3.amazonaws.com/criterion-production/films/4769edd08606508fb82f823c778297f4/6EpySxomWsrT7vfmRGVtFhIvfBDFva_medium.jpg", price: 32.28, amazon: "https://www.amazon.com/dp/B003ZYU3U0", plot: "The Night of the Hunter\u2014incredibly, the only film the great actor Charles Laughton ever directed\u2014is truly a stand-alone masterwork. A horror movie with qualities of a Grimm fairy tale, it stars a sublimely sinister Robert Mitchum as a traveling preacher named Harry Powell (he of the tattooed knuckles), whose nefarious motives for marrying a fragile widow, played by Shelley Winters, are uncovered by her terrified young children. Graced by images of eerie beauty and a sneaky sense of humor, this ethereal, expressionistic American classic\u2014also featuring the contributions of actress Lillian Gish and writer James Agee\u2014is cinema\u2019s most eccentric rendering of the battle between good and evil. The Night of the Hunter was restored by the UCLA Film & Television Archive in cooperation with Metro-Goldwyn-Mayer Studios, Inc., with funding provided by Robert Sturm and The Film Foundation." },
  { rank: 43, title: "The Night of the Iguana", director: "John Huston", year: 1964, country: "USA", genre: "Drama", runtime: 125, price: 8.99, amazon: "https://www.amazon.com/dp/B0BKD2Q3B8", plot: "The Night of the Iguana is a stage play written by American author Tennessee Williams. It is based on his 1948 short story. In 1959, Williams staged it as a one-act play, and over the next two years he developed it into a full-length play, producing two different versions in 1959 and 1960, and then arriving at the three-act version that premiered on Broadway in 1961. Two film adaptations have been made: The Oscar-winning 1964 film directed by John Huston and starring Richard Burton, Ava Gardner, and Deborah Kerr, and a 2000 Croatian production." },
  { rank: 44, title: "Paths of Glory", director: "Stanley Kubrick", year: 1957, country: "USA", genre: "War/Drama", runtime: 88, criterion: "https://www.criterion.com/films/27522-paths-of-glory", poster: "https://s3.amazonaws.com/criterion-production/films/4da269635a13e714b4021c37b5757fc9/N9wFOGE7IhMyxv0TF5tvzn9bXA6hJ1_medium.jpg", price: 32.28, amazon: "https://www.amazon.com/dp/B003WKL6YO", plot: "Stanley Kubrick's Paths of Glory is among the most powerful antiwar films ever made. A fiery Kirk Douglas stars as a World War I French colonel who goes head-to-head with the army\u2019s ruthless top brass when his men are accused of cowardice after being unable to carry out an impossible mission. This haunting, exquisitely photographed dissection of the military machine in all its absurdity and capacity for dehumanization (a theme Kubrick would continue to explore throughout his career) is assembled with its legendary director\u2019s customary precision, from its tense trench warfare sequences to its gripping courtroom climax to its ravaging final scene. Paths of Glory was restored by the UCLA Film & Television Archive in cooperation with MGM Studios, with funding provided by The Film Foundation and the Hollywood Foreign Press Association." },
  { rank: 45, title: "Dr. Strangelove", director: "Stanley Kubrick", year: 1964, country: "USA/UK", genre: "Comedy/War", runtime: 95, criterion: "https://www.criterion.com/films/28822-dr-strangelove-or-how-i-learned-to-stop-worrying-and-love-the-bomb", poster: "https://s3.amazonaws.com/criterion-production/films/0a9d8cafec1031c98436007b77553d6f/8RnJTFRJr7Ho5oNBlduI3C9erCpY1t_medium.jpg", price: 45.99, amazon: "https://www.amazon.com/dp/B01D3LBCQS", plot: "Stanley Kubrick\u2019s painfully funny take on Cold War anxiety is one of the fiercest satires of human folly ever to come out of Hollywood. The matchless shape-shifter Peter Sellers plays three wildly different roles: Royal Air Force Captain Lionel Mandrake, timidly trying to stop a nuclear attack on the USSR ordered by an unbalanced general (Sterling Hayden); the ineffectual and perpetually dumbfounded U.S. President Merkin Muffley, who must deliver the very bad news to the Soviet premier; and the titular Strangelove himself, a wheelchair-bound presidential adviser with a Nazi past. Finding improbable hilarity in nearly every unimaginable scenario, Dr. Strangelove, or: How I Learned to Stop Worrying and Love the Bomb is a subversive masterpiece that officially announced Kubrick as an unparalleled stylist and pitch-black ironist." },
  { rank: 46, title: "2001: A Space Odyssey", director: "Stanley Kubrick", year: 1968, country: "USA/UK", genre: "Sci-Fi", runtime: 149, criterion: "https://www.criterion.com/films/35286-2001-a-space-odyssey", poster: "https://s3.amazonaws.com/criterion-production/films/2ab88200f10426e3f34168d2c261e8c7/ZSrZmLwlCrTutqbfBCCYUuKgCLoCc4_medium.jpg", price: 11.98, amazon: "https://www.amazon.com/dp/B00417U8UU", plot: "With this monument of twentieth-century art, Stanley Kubrick fused pop cinema and avant-garde abstraction as never before, resulting in the most influential science-fiction film ever made and a blockbuster of unprecedented philosophical and spiritual depth. Inspired by the futurist writings of Arthur C. Clarke, 2001: A Space Odyssey journeys from the dawn of man to the space age, as two astronauts on a mission to Jupiter discover realms beyond human understanding, along the way awakening to the horror that their ship\u2019s sentient supercomputer, HAL 9000, has turned against them. Both a marvel of technological realism and an otherworldly cosmic ballet composed in images of enigmatic, oneiric power, this consciousness-bending voyage into the unknown continues to inspire awed terror and infinite wonder." },
  { rank: 47, title: "A Clockwork Orange", director: "Stanley Kubrick", year: 1971, country: "USA/UK", genre: "Crime/Sci-Fi", runtime: 136, criterion: "https://www.criterion.com/films/30441-a-clockwork-orange", poster: "https://s3.amazonaws.com/criterion-production/films/a3fd67fc363a7fa8fc6e627191ed00e7/GMQ9Ti1y7uM6uqeVU7hPsAgeoMgOja_medium.jpg", price: 63.93, amazon: "https://www.amazon.com/dp/B01N0WZ41K", plot: "Sex, shock, and ultraviolence: with his mega-controversial adaptation of Anthony Burgess\u2019s cult novel, Stanley Kubrick unleashed this indelibly startling vision of the future. In a pop-art-stylized dystopian London, sadistic thug Alex DeLarge (Malcolm McDowell) and his band of hooligans terrorize the streets\u2014until cruel irony makes Alex a pawn in a much larger game of social and political control. A defining statement for the director on the tension between free will and institutional authority, and one of the most provocative films ever made about the nature of violence, A Clockwork Orange stands as a work of totemic significance: visually brilliant, frighteningly funny, and fearless in its vast philosophical and moral implications." },
  { rank: 48, title: "The Killing", director: "Stanley Kubrick", year: 1956, country: "USA", genre: "Film Noir/Crime", runtime: 85, criterion: "https://www.criterion.com/films/27751-the-killing", poster: "https://s3.amazonaws.com/criterion-production/films/09b4b650ba3c7dd2bd35077502c96bf6/Vlq14mj2f7tyWxTjHSUgAV3VN6upwP_medium.jpg", price: 32.28, amazon: "https://www.amazon.com/dp/B005152C78", plot: "Stanley Kubrick\u2019s account of an ambitious racetrack robbery is one of Hollywood\u2019s tautest, twistiest noirs. Aided by a radically time-shuffling narrative, razor-sharp dialogue from pulp novelist Jim Thompson, and a phenomenal cast of character actors, including Sterling Hayden, Coleen Gray, Timothy Carey, Elisha Cook Jr., and Marie Windsor, The Killing is both a jaunty thriller and a cold-blooded punch to the gut. And with its precise tracking shots and gratifying sense of irony, it\u2019s Kubrick to the core." },
  { rank: 49, title: "Barry Lyndon", director: "Stanley Kubrick", year: 1975, country: "USA/UK", genre: "Drama/Romance", runtime: 185, criterion: "https://www.criterion.com/films/29008-barry-lyndon", poster: "https://s3.amazonaws.com/criterion-production/films/6008ef33f62d3c513d3e8690eabad3ab/DWFlkJcNJFhPgwcZ2cXGytqtSHsPCZ_medium.jpg", price: 33.21, amazon: "https://www.amazon.com/dp/B0F4Y31TQ6", plot: "Stanley Kubrick bent the conventions of the historical drama to his own will in this dazzling vision of a pitiless aristocracy, adapted from a novel by William Makepeace Thackeray. In picaresque detail, Barry Lyndon chronicles the adventures of an incorrigible trickster (Ryan O\u2019Neal) whose opportunism takes him from an Irish farm to the battlefields of the Seven Years\u2019 War and the parlors of high society. For the most sumptuously crafted film of his career, Kubrick recreated the decadent surfaces and intricate social codes of the period, evoking the light and texture of eighteenth-century painting with the help of pioneering cinematographic techniques and lavish costume and production design, all of which earned Academy Awards. The result is a masterpiece\u2014a sardonic, devastating portrait of a vanishing world whose opulence conceals the moral vacancy at its heart." },
  { rank: 50, title: "Brazil", director: "Terry Gilliam", year: 1985, country: "UK", genre: "Sci-Fi/Dystopia", runtime: 143, criterion: "https://www.criterion.com/films/211-brazil", poster: "https://s3.amazonaws.com/criterion-production/films/4465e85d9b83346a84976bdae16c2cb9/kncSHt6Pxm1wjWODxnozz5Nj8BbDqi_medium.jpg", plot: "In the dystopian masterpiece Brazil , Jonathan Pryce plays a daydreaming everyman who finds himself caught in the soul-crushing gears of a nightmarish bureaucracy. This cautionary tale by Terry Gilliam, one of the great films of the 1980s, has come to be esteemed alongside antitotalitarian works by the likes of George Orwell, Aldous Huxley, and Kurt Vonnegut. And in terms of set design, cin ematography, music, and effects, Brazil is a nonstop dazzler." },
  { rank: 51, title: "Time Bandits", director: "Terry Gilliam", year: 1981, country: "UK", genre: "Adventure/Fantasy", runtime: 110, criterion: "https://www.criterion.com/films/232-time-bandits", poster: "https://s3.amazonaws.com/criterion-production/films/d1ddaf83ba2425cd495aa7df240bcf64/sMIoLxvGbFo79lDLGem0KjyH93zWwq_medium.jpg", price: 19.58, amazon: "https://www.amazon.com/dp/B00NMUCHMY", plot: "In this fantastic voyage through time and space from Terry Gilliam, a boy named Kevin (Craig Warnock) escapes his gadget-obsessed parents to join a band of time travelers. Armed with a map stolen from the Supreme Being (Ralph Richardson), they plunder treasure from Napoleon (Ian Holm) and Agamemnon (Sean Connery)\u2014but the Evil Genius (David Warner) is watching their every move. Featuring a darkly playful script by Gilliam and his Monty Python cohort Michael Palin (who also appears in the film), Time Bandits is at once a giddy fairy tale, a revisionist history lesson, and a satire of technology gone awry." },
  { rank: 52, title: "Fear and Loathing in Las Vegas", director: "Terry Gilliam", year: 1998, country: "USA", genre: "Comedy/Drama", runtime: 118, criterion: "https://www.criterion.com/films/215-fear-and-loathing-in-las-vegas", poster: "https://s3.amazonaws.com/criterion-production/films/2eab6c19498ccc9c45709af90f0cc5da/POE0rbVpiFeXo7erOISf126v663x9J_medium.jpg", price: 32.29, amazon: "https://www.amazon.com/dp/B0CY77RSGQ", plot: "It is 1971, and journalist Raoul Duke barrels toward Las Vegas\u2014accompanied by a trunkful of contraband and his slightly unhinged Samoan attorney, Dr. Gonzo\u2014to cover a motorcycle race. What should be a cut-and-dried journalistic assignment quickly descends into a feverish psychedelic odyssey. Director Terry Gilliam and an all-star cast, headlined by Johnny Depp and Benicio Del Toro, show no mercy in bringing Hunter S. Thompson\u2019s excoriating dissection of the American way of life to the screen, creating a film both hilarious and savage." },
  { rank: 53, title: "The Great Beauty", director: "Paolo Sorrentino", year: 2013, country: "Italy", genre: "Drama", runtime: 141, criterion: "https://www.criterion.com/films/28604-the-great-beauty", poster: "https://s3.amazonaws.com/criterion-production/films/b25a8a700e4c33e76eb53578bc5de7d6/0g1hKjX8xWZ1L1jAfhGJFvGaNrMG7O_medium.jpg", price: 21.98, amazon: "https://www.amazon.com/dp/B00HE010QM", plot: "For decades, journalist Jep Gambardella has charmed and seduced his way through the glittering nightlife of Rome. Since the legendary success of his only novel, he has been a permanent fixture in the city\u2019s literary and elite social circles. But on his sixty-fifth birthday, Jep unexpectedly finds himself taking stock of his life, turning his cutting wit on himself and his contemporaries, and looking past the lavish nightclubs, parties, and caf\u00e9s to find Rome itself, in all its monumental glory: a timeless landscape of absurd, exquisite beauty. Featuring sensuous cinematography, a lush score, and an award-winning central performance by the great Toni Servillo, this transporting experience by the brilliant Italian director Paolo Sorrentino is a breathtaking Felliniesque tale of decadence and lost love." },
  { rank: 54, title: "Il Sorpasso", director: "Dino Risi", year: 1962, country: "Italy", genre: "Comedy/Drama", runtime: 105, criterion: "https://www.criterion.com/films/28429-il-sorpasso", poster: "https://s3.amazonaws.com/criterion-production/films/41d9df20fc245c4ecc12ef934533adc2/HrfTWPnllatTkm1Npqwr0o4Jslre1h_medium.jpg", price: 19.99, amazon: "https://www.amazon.com/dp/B00HVOFP9O", plot: "The ultimate Italian road comedy, Il sorpasso stars the unlikely pair of Vittorio Gassman and Jean-Louis Trintignant as, respectively, a waggish, freewheeling bachelor and the straitlaced law student he takes on a madcap trip from Rome to Tuscany. An unpredictable journey that careers from slapstick to tragedy, this film, directed by Dino Risi, is a wildly entertaining commentary on the pleasures and consequences of the good life. A holy grail of commedia all\u2019italiana, Il sorpasso is so fresh and exciting that one can easily see why it has long been adored in Italy." },
  { rank: 55, title: "Rome, Open City", director: "Roberto Rossellini", year: 1945, country: "Italy", genre: "Drama/War", runtime: 103, criterion: "https://www.criterion.com/films/975-rome-open-city", poster: "https://s3.amazonaws.com/criterion-production/films/065858072a69f217ae517f2cc87a2c68/0T7IhsxzrE4rW48efa7kEHGrSe77j0_medium.jpg", price: 75.15, amazon: "https://www.amazon.com/dp/B071CK8CHK", plot: "This was Roberto Rossellini\u2019s revelation, a harrowing drama about the Nazi occupation of Rome and the brave few who struggled against it. Though told with more melodramatic flair than the films that would follow it to form The War Trilogy and starring some well-known actors\u2014Aldo Fabrizi as a priest helping the partisan cause and Anna Magnani in her breakthrough role as the fianc\u00e9e of a resistance member\u2014Rome Open City is a shockingly authentic experience, conceived and directed amid the ruin of World War II, with immediacy in every frame. Marking a watershed moment in Italian cinema, this galvanic work garnered awards around the globe and left the beginnings of a new film movement in its wake." },
  { rank: 56, title: "Paisan", director: "Roberto Rossellini", year: 1946, country: "Italy", genre: "Drama/War", runtime: 126, criterion: "https://www.criterion.com/films/2415-paisan", poster: "https://s3.amazonaws.com/criterion-production/films/7b27c9719b8fe36e334fa0ba43910a0e/GwB3ma4IYcYsr5CZ4ZizQW0i0mxyxc_medium.jpg", price: 75.15, amazon: "https://www.amazon.com/dp/B071CK8CHK", plot: "Roberto Rossellini\u2019s follow-up to his breakout Rome Open City was the ambitious, enormously moving Paisan, which consists of six episodes set during the liberation of Italy at the end of World War II, and taking place across the country, from Sicily to the northern Po valley. With its documentary-like visuals and intermingled cast of actors and nonprofessionals, Italians and their American liberators, this look at the struggles of different cultures to communicate and of people to live their everyday lives in extreme circumstances is equal parts charming sentiment and vivid reality. A long-missing treasure of Italian cinema, Paisan is available here in its full original release version." },
  { rank: 57, title: "Germany Year Zero", director: "Roberto Rossellini", year: 1948, country: "Italy/Germany", genre: "Drama/War", runtime: 78, criterion: "https://www.criterion.com/films/297-germany-year-zero", poster: "https://s3.amazonaws.com/criterion-production/films/7cb52be2fd1572e3a5b5276e84d487fa/TECVVTeHMMxaHWxosd91eIX8qS2hMK_medium.jpg", price: 75.15, amazon: "https://www.amazon.com/dp/B002U6DVQ2", plot: "The concluding chapter of Roberto Rossellini\u2019s War Trilogy is the most devastating, a portrait of an obliterated Berlin, seen through the eyes of a twelve-year-old boy. Living in a bombed-out apartment building with his sick father and two older siblings, young Edmund is mostly left to wander unsupervised, getting ensnared in the black-market schemes of a group of teenagers and coming under the nefarious influence of a Nazi-sympathizing ex-teacher. Germany Year Zero is a daring, gut-wrenching look at the consequences of fascism, for society and the individual." },
  { rank: 58, title: "Journey to Italy", director: "Roberto Rossellini", year: 1954, country: "Italy/France", genre: "Drama/Romance", runtime: 85, criterion: "https://www.criterion.com/films/28081-journey-to-italy", poster: "https://s3.amazonaws.com/criterion-production/films/3adb5e31584cf1e6af389110b36c7406/dO7ezVSscotCRC6NYkQCh30BIPx6bM_medium.jpg", price: 49.99, amazon: "https://www.amazon.com/dp/B00DHN8G58", plot: "Among the most influential films of the postwar era, Roberto Rossellini\u2019s Journey to Italy (Viaggio in Italia) charts the declining marriage of a couple from England (Ingrid Bergman and George Sanders) on a trip in the countryside near Naples. More than just the anatomy of a relationship, Rossellini\u2019s masterpiece is a heartrending work of emotion and spirituality. Considered a predecessor to the existentialist works of Michelangelo Antonioni and hailed as a groundbreaking modernist work by the legendary film journal Cahiers du cine\u0301ma, Journey to Italy is a breathtaking cinematic benchmark." },
  { rank: 59, title: "The Leopard", director: "Luchino Visconti", year: 1963, country: "Italy", genre: "Drama/History", runtime: 185, criterion: "https://www.criterion.com/films/790-the-leopard", poster: "https://s3.amazonaws.com/criterion-production/films/96833308352eedd79b50b2de8016a6c5/7IQOqWTrRuJg90rWrJZbK1VXI7aDcR_medium.jpg", price: 39.24, amazon: "https://www.amazon.com/dp/B00MRKX8FA", plot: "Making its long-awaited U.S. home video debut, Luchino Visconti\u2019s The Leopard (Il Gattopardo) is an epic on the grandest possible scale. The film recreates, with nostalgia, drama, and opulence, the tumultuous years of Italy's Risorgimento\u2014when the aristocracy lost its grip and the middle classes rose and formed a unified, democratic Italy. Burt Lancaster stars as the aging prince watching his culture and fortune wane in the face of a new generation, represented by his upstart nephew (Alain Delon) and his beautiful fianc\u00e9e (Claudia Cardinale). Awarded the Palme d\u2019Or at the 1963 Cannes Film Festival, The Leopard translates Giuseppe Tomasi di Lampedusa's novel, and the history it recounts, into a truly cinematic masterpiece. The Criterion Collection is proud to present the film in two distinct versions: Visconti\u2019s original Italian version, and the alternate English-language version released" },
  { rank: 60, title: "Rocco and His Brothers", director: "Luchino Visconti", year: 1960, country: "Italy", genre: "Drama", runtime: 177, price: 19.99, amazon: "https://www.amazon.com/dp/B07D5QSF3B", plot: "After the death of his father, Rocco Parondi, one of the five sons of a poor rural Italian family, travels north from Lucania with his widowed mother Rosaria and three of his brothers\u2014Simone, Ciro, and Luca\u2014to the industrial city of Milan. They expect to stay with Vincenzo, the eldest brother, in the Milan suburb of Lambrate, but the family of Vincenzo's fiancee, Ginetta, object to the presence of the unschooled and unemployed southerners, and the Parondis end up in an unheated basement. After Ginetta becomes pregnant by Vincenzo and they marry, Vincenzo sees little of his mother and four brothers, who have to make their own way.\nSimone, the second brother, struggles to adapt to urban life. He becomes attracted to a prostitute named Nadia, who urges him to pursue a career in boxing, which his mother also encourages, as a fast way to achieve fame and wealth. Though he falls in love with Nadia and demands more than a casual relationship, she rejects him after returning jewelry he stole from Rocco's boss for her.\nRocco, the third brother, is called up for military service. Near the end of his enlistment, he runs into Nadia, who has just finished a prison sentence for prostitution. His innocence and purity of heart inspires her to give up her way of life and enter an exclusive relationship with him. When Simone learns of this, he attacks Rocco and Nadia with a gang of friends and rapes Nadia to \"teach Rocco a lesson\". Not having realized how much their relationship would hurt his brother, Rocco breaks up with Nadia and encourages her to return to Simone, which she eventually does, though only to try to hasten his downfall.\nCiro, the second-youngest brother, attends night school and finds steady work at the Alfa Romeo factory. He tries his best to help make his family a success in their new hometown, and becomes engaged to a local woman from a good family.\nRocco often acts to preserve the well-being of his family members at some cost to his own happiness. He frequently covers for Simone, in particular, such as when he returns the jewelry that Simone stole from his employer, or when, after Simone's obsession with Nadia has ended his boxing career by causing him to spiral into alcoholism and a generally dissolute lifestyle, Rocco agrees to sign a ten-year boxing contract in order to pay back Simone's debts, including to a homosexual man he robbed under compromising circumstances.\nWhile Rocco is fighting in a championship bout, Simone visits Nadia, who has returned to working as a prostitute, near the Ponte della Ghisolfa (it) and kills her after she tells him how much she hates him. Rocco wins the fight, and, during the celebration with his family, he expresses a desire to return to their home in Lucania someday, and his mother indicates that she misses having all of her sons together. A bloody Simone interrupts the party and confesses to Nadia's murder. Rocco, despite his anguish, still wants to protect Simone, but Ciro refuses to go along and leaves to alert the police.\nThe youngest brother, Luca, does little most of the time other than watch as events unfold around him. \u0397e visits Ciro at work to say that Simone has been caught and invite Ciro home for dinner. Luca says he would like to return south with Rocco. Ciro responds that he does not think Rocco will ever make it back home, and that, although Luca could, he would not find it the same as it was due to the progress that will inevitably, eventually affect every place. While many people fear the changing world, Ciro says he does not. He says Luca will live a better life because of the changes. He turns to go back to work and Luca walks away. In a long shot, we see Luca passing a newspaper stand, where he sees Rocco's picture in an article about the many far-flung cities in which he has upcoming fights, and then moving away towards the city." },
  { rank: 61, title: "Senso", director: "Luchino Visconti", year: 1954, country: "Italy", genre: "Drama/Romance", runtime: 123, criterion: "https://www.criterion.com/films/27543-senso", poster: "https://s3.amazonaws.com/criterion-production/films/74be83402097d3f4c5d9e7331de31471/43YJwgdfANxgafSJNaTDUwGxR8Gait_medium.jpg", price: 19.99, amazon: "https://www.amazon.com/dp/B004CIIXCS", plot: "This lush, Technicolor tragic romance from Luchino Visconti stars Alida Valli as a nineteenth-century Italian countess who, during the Austrian occupation of her country, puts her marriage and political principles on the line by engaging in a torrid affair with a dashing Austrian lieutenant, played by Farley Granger. Gilded with ornate costumes and sets and a rich classical soundtrack, and featuring fearless performances, this operatic melodrama is an extraordinary evocation of reckless emotions and deranged lust, from one of the cinema\u2019s great sensualists. Senso was restored by StudioCanal, Centro Sperimentale di Cinematografia-Cineteca Nazionale, and the Cineteca di Bologna at L\u2019Immagine Ritrovata. Restoration funding provided by Gucci, The Film Foundation, and Comitato Italia 150." },
