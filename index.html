  { rank: 62, title: "La Notte", director: "Michelangelo Antonioni", year: 1961, country: "Italy", genre: "Drama/Romance", runtime: 122, criterion: "https://www.criterion.com/films/28111-la-notte", poster: "https://s3.amazonaws.com/criterion-production/films/1bbf4ac37c8637e832706826717cfb58/j8kye88ZxeKVhkU8YRBocTvZSvLHXB_medium.jpg", price: 32.28, amazon: "https://www.amazon.com/dp/B00DZP1C3Q", plot: "This psychologically acute, visually striking modernist work was director Michelangelo Antonioni\u2019s follow-up to the epochal L\u2019avventura. Marcello Mastroianni and Jeanne Moreau star as a novelist and his frustrated wife, who, over the course of one night, confront their alienation from each other and the achingly empty bourgeois Milan circles in which they travel. Antonioni\u2019s muse Monica Vitti smolders as an industrialist\u2019s tempting daughter. Moodily sensual cinematography and subtly expressive performances make La notte an indelible illustration of romantic and social deterioration." },
  { rank: 63, title: "L'Avventura", director: "Michelangelo Antonioni", year: 1960, country: "Italy", genre: "Drama/Mystery", runtime: 143, criterion: "https://www.criterion.com/films/209-l-avventura", poster: "https://s3.amazonaws.com/criterion-production/films/28d6495a960ffeca7c74c5a56d6e36e2/f26v2AQ2lv4qS52sB63uNszRHHhBDp_medium.jpg", price: 24.75, amazon: "https://www.amazon.com/dp/B00MRKX9F4", plot: "Michelangelo Antonioni invented a new film grammar with this masterwork. An iconic piece of challenging 1960s cinema and a gripping narrative on its own terms, L\u2019avventura concerns the enigmatic disappearance of a young woman during a yachting trip off the coast of Sicily, and the search taken up by her disaffected lover (Gabriele Ferzetti) and best friend (Monica Vitti, in her breakout role). Antonioni\u2019s controversial international sensation is a gorgeously shot tale of modern ennui and spiritual isolation." },
  { rank: 64, title: "Blow-Up", director: "Michelangelo Antonioni", year: 1966, country: "Italy/UK", genre: "Mystery/Drama", runtime: 111, criterion: "https://www.criterion.com/films/28694-blow-up", poster: "https://s3.amazonaws.com/criterion-production/films/83e5df1cf7966e4e5392de109198023c/vmS4CDfnJ0R6Qu3O4P0ud3FMrjlc29_medium.jpg", price: 33.2, amazon: "https://www.amazon.com/dp/B01MSZLUQ6", plot: "In 1966, Michelangelo Antonioni transplanted his existentialist ennui to the streets of swinging London for this international sensation, the Italian filmmaker\u2019s first English-language feature. A countercultural masterpiece about the act of seeing and the art of image making, Blow-Up takes the form of a psychological mystery, starring David Hemmings as a fashion photographer who unknowingly captures a death on film after following two lovers in a park. Antonioni\u2019s meticulous aesthetic control and intoxicating color palette breathe life into every frame, and the jazzy sounds of Herbie Hancock, a beautifully evasive performance by Vanessa Redgrave, and a cameo by the Yardbirds make the film a transporting time capsule from a bygone era. Blow-Up is a seductive immersion into creative passion, and a brilliant film by one of cinema\u2019s greatest artists." },
  { rank: 65, title: "Red Desert", director: "Michelangelo Antonioni", year: 1964, country: "Italy", genre: "Drama", runtime: 117, criterion: "https://www.criterion.com/films/1454-red-desert", poster: "https://s3.amazonaws.com/criterion-production/films/f0698d10e7f1a77dd8e328a8ea94797f/Vd8Khg2Vd5KoE8hVxNrGs10PHkZAgZ_medium.jpg", price: 19.99, amazon: "https://www.amazon.com/dp/B003D3Y64M", plot: "Michelangelo Antonioni\u2019s 1960s panoramas of contemporary alienation were decade-defining artistic events, and Red Desert, his first color film, is perhaps his most epochal. This provocative look at the spiritual desolation of the technological age\u2014about a disaffected woman, brilliantly portrayed by Antonioni muse Monica Vitti, wandering through a bleak industrial landscape beset by power plants and environmental toxins, and tentatively flirting with her husband\u2019s coworker, played by Richard Harris\u2014continues to keep viewers spellbound. With one startling, painterly composition after another\u2014of abandoned fishing cottages, electrical towers, looming docked ships\u2014Red Desert creates a nearly apocalyptic image of its time, and confirms Antonioni as cinema\u2019s preeminent poet of the modern age." },
  { rank: 66, title: "Amarcord", director: "Federico Fellini", year: 1973, country: "Italy", genre: "Comedy/Drama", runtime: 123, criterion: "https://www.criterion.com/films/208-amarcord", poster: "https://s3.amazonaws.com/criterion-production/films/84514daa31d11ecc8efb89a53abba2f8/u6uT9NDu4YUQGebS2sXinyxWiNLJIp_medium.jpg", price: 33.2, amazon: "https://www.amazon.com/dp/B01MXZ7HD4", plot: "Federico Fellini returned to the provincial landscape of his childhood with this carnivalesque reminiscence, recreating his hometown of Rimini in Cinecitt\u00e0\u2019s studios and rendering its daily life as a circus of social rituals, adolescent desires, male fantasies, and political subterfuge. Sketching a gallery of warmly observed comic caricatures, Fellini affectionately evokes a vanished world haloed with the glow of memory, even as he sends up authority figures representing church and state, satirizing a country stultified by Fascism. Winner of Fellini\u2019s fourth Academy Award for best foreign-language film, Amarcord remains one of the director\u2019s best-loved creations, beautifully weaving together Giuseppe Rottuno\u2019s colorful cinematography, Danilo Donati\u2019s extravagant costumes and sets, and Nino Rota\u2019s nostalgia-tinged score." },
  { rank: 67, title: "Nights of Cabiria", director: "Federico Fellini", year: 1957, country: "Italy", genre: "Drama", runtime: 110, criterion: "https://www.criterion.com/films/243-nights-of-cabiria", poster: "https://s3.amazonaws.com/criterion-production/films/6e1b17eceed949c213f0079e5491710c/MZZllkqCo3ZPrbrZUI3XTf4kCJRKuF_medium.jpg", price: 89.99, amazon: "https://www.amazon.com/dp/B00000IOKV", plot: "In the fifth of their immortal collaborations, Federico Fellini and the exquisitely expressive Giulietta Masina completed the creation of one of the most indelible characters in all of cinema: Cabiria, an irrepressible, fiercely independent sex worker who, as she moves through the sea of Rome\u2019s humanity, through adversity and heartbreak, must rely on herself\u2014and her own indomitable spirit\u2014to stay standing. Winner of the best actress prize at Cannes for Masina and the Academy Award for best foreign-language film, Nights of Cabiria brought the early, neorealist-influenced phase of Fellini\u2019s career to a transcendent close with its sublimely heartbreaking yet hopeful final image, which embodies, perhaps more than any other in the director\u2019s body of work, the blend of the bitter and the sweet that define his vision of the world. Collector's Set Cast & Credits Giulietta Masina Cabiria Fran\u00e7ois" },
  { rank: 68, title: "La Strada", director: "Federico Fellini", year: 1954, country: "Italy", genre: "Drama", runtime: 108, criterion: "https://www.criterion.com/films/185-la-strada", poster: "https://s3.amazonaws.com/criterion-production/films/3ada40824f5c3aca9583dfbd8b3b6792/9sIzSjGnd1Uzz4x3nn4yq6tpaif5xK_medium.jpg", price: 32.28, amazon: "https://www.amazon.com/dp/B09CS2Y7TS", plot: "With this breakthrough film, Federico Fellini launched both himself and his wife and collaborator Giulietta Masina to international stardom, breaking with the neorealism of his early career in favor of a personal, poetic vision of life as a bittersweet carnival. The infinitely expressive Masina registers both childlike wonder and heartbreaking despair as Gelsomina, loyal companion to the traveling strongman Zampan\u00f2 (Anthony Quinn, in a toweringly physical performance), whose callousness and brutality gradually wear down her gentle spirit. Winner of the very first Academy Award for Best Foreign-Language Film, La strada possesses the purity and timeless resonance of a fable and remains one of cinema\u2019s most exquisitely moving visions of humanity struggling to survive in the face of life\u2019s cruelties." },
  { rank: 69, title: "S\u00e1t\u00e1ntang\u00f3", director: "B\u00e9la Tarr", year: 1994, country: "Hungary", genre: "Drama", runtime: 450, price: 25.23, amazon: "https://www.amazon.com/dp/B08MHCT6GG", plot: "In a desolate Hungarian village, after the collapse of a collective farm, two people, Futaki and Mrs. Schmidt, are in a romantic embrace when Futaki is awakened at dawn by the ringing of church bells. Mr. Schmidt conspires with another co-worker named Kr\u00e1ner to steal the villagers' money and flee to another part of the country. As Futaki is sneaking out of the Schmidt home, he overhears Schmidt's plans, after which he demands to become part of the scheme\u2014all this being watched by a lonely drunken man known as the Doctor, who writes the events down in a notebook.\nThe conspiracy fails when rumors spread across the village that the charismatic and manipulative Irimi\u00e1s, a former co-worker who had been presumed dead, is returning with his friend Petrina. Previously, Irimi\u00e1s and Petrina had been forced under threat of arrest to continue their criminal enterprise in the employ of the police captain in a nearby town. After hearing a mysterious drone in a bar and proclaiming their intent to blow everything up, they begin their march to the village. They are welcomed by their young ally Sanyi Horgos, with whom they had made a deal so that Sanyi would spread word among the villagers that the two had died.\nAt the village, the Doctor discovers that he has run out of fruit brandy. Unaccustomed to leaving his house, he decides to go out to buy liquor nonetheless. Outside, he is met with hostile weather and the arrival of night. He meets Sanyi's older sisters, who are prostitutes dreaming of running away to town since none of the locals have money anymore. After an impossibly long time, the doctor arrives at the local tavern to purchase his brandy, but is unable to find the courage to enter. The doctor is accosted by Estike, Sanyi's little sister, whose father hanged himself and who had previously been institutionalized. Estike causes the doctor to fall in the mud. In a state of emotional tension, after reacting angrily to this, the Doctor reconsiders and naively tries to apologize as the girl leaves and disappears in the darkness. Chasing after her, the Doctor passes out and collapses in a nearby wood, and is found in the morning by the town's conductor who takes him to a hospital.\nThe morning before the Doctor left his house, Estike is tricked by her older brother Sanyi into planting a \"money tree\" in the forest. She tortures and poisons her cat to death, and carries its corpse to the money tree, finding it dug up by her brother who has reclaimed the money. Marauding through the woods, the girl approaches the local tavern and peers through its window, where most of the villagers dance to accordion music, unaware of the peeping child. Afterwards, she encounters the Doctor and retreats into an abandoned ruin, fatally poisoning herself with the feeling that every movement of the world is preordained.\nThe following day, Irimi\u00e1s arrives at the village while Estike's funeral is being held. Irimi\u00e1s tells the villagers they were all guilty of Estike's death and talks most of them into handing him all their money in order to start a new collective in a nearby estate. The villagers (excepting the publican, Sanyi's family and the Doctor) walk together, wheeling their few belongings to a distant abandoned mansion where they lie down to sleep, whereupon the narrator describes the dreams each of them has. Meanwhile, Irimi\u00e1s, Sanyi and Petrina are walking when Irimi\u00e1s drops to his knees while hearing once again the mysterious drone as the fog lifts from the ruin where Estike died. They later meet with an accomplice in a nearby town to acquire a large amount of explosives, for reasons never explicitly explained.\nThe next morning, when Irimi\u00e1s is late, the villagers decide that they have been duped by Irimi\u00e1s, and fight among themselves. Schmidt and Kr\u00e1ner accuse Futaki of having led them into this trap and demand that he return their money. As they beat him up, Irimi\u00e1s arrives, scolds them for their squabbling and tells them that his plan to establish a new farm has been delayed by the authorities and that their only hope is to scatter around the country for an unspecified amount of time. Kr\u00e1ner demands that Irimi\u00e1s give their money back. Irimi\u00e1s does so, but expresses his disappointment at their lack of trust and unreliability, shaming Kr\u00e1ner into once more giving his money to him. Irimi\u00e1s, Petrina and Sanyi drive the villagers and their belongings by truck to the city, where Irimi\u00e1s assigns the Schmidts, the Kr\u00e1ners and the Halicses different towns and different tasks, gives them each 1,000 forints and dismisses them. Futaki, however, tells Irimi\u00e1s that he would rather find a job as a watchman, takes his thousand forints and leaves on his own. The fate of the headmaster remains unclear.\nThe police receive Irimi\u00e1s' devastating report about the villagers' poor abilities and defects and decide to rewrite it in a less vulgar manner before filing it away and leaving.\nThe Doctor returns home after thirteen days in the hospital, unaware that Irimi\u00e1s has taken the entire community away with him. He sits down to write his notes, assuming that all his neighbors are snoring in their beds. He suddenly hears the same bells toll that woke Futaki at the beginning of the film. The Doctor leaves his house again to investigate the ruined church from which the sound of the bells comes, because the bell tower is not supposed to be working. He discovers a madman inside the ruins striking a bell clapper with a metal rod like a gong and shouting endlessly that the Turks are coming. Frightened, the Doctor returns home and proceeds to board up the window in front of his desk, plunging himself into total darkness as he sits and writes the narration which began the film. The tolling of church bells continues throughout the last part of the film and the displaying of the end credits." },
  { rank: 70, title: "The Turin Horse", director: "B\u00e9la Tarr", year: 2011, country: "Hungary", genre: "Drama", runtime: 155, price: 34.95, amazon: "https://www.amazon.com/dp/B007P4SQB4", plot: "The film begins with a likely apocryphal story about German philosopher Friedrich Nietzsche's mental breakdown on 3 January 1889 when he stayed at number six, Via Carlo Alberto, Turin, Italy. There, a coach driver was having trouble with a \"stubborn\" horse. The horse refused to move, whereupon the driver lost his temper and took his whip to it. Nietzsche was greatly disturbed and threw his arms around the horse's neck, sobbing. His neighbor took him home, where he lay motionless and silent for two days on a divan, until he muttered the words \"Mutter, ich bin dumm\" (Mother, I am stupid). He lived for another ten years, gentle and demented, in the care of his mother and sisters.\nThe film then moves to the countryside, possibly in the 19th century Great Hungarian Plain, where the coach driver lives with his daughter and the horse. It depicts six days of their lives. Outside of their hut, windstorms rage. They live out an arduous and repetitive existence and often take turns sitting by the window alone. Starting on the second day, the horse becomes increasingly uncooperative, refusing to leave the property or eat and drink. In the evening a neighbor Bernhard visits to buy some brandy; he claims that the nearby town has been completely destroyed, and blames the apocalyptic scenario on both God and man.\nOn the third day, a band of \"gypsies\" (Romani) arrives on a horse-drawn vehicle and drinks from the family's well without permission. The daughter and then the father come out to drive them away. Before departing, some young men from the band warn that they will come back to use the well, and an old man gives the daughter a book, which she reads that evening. When they wake up the next morning on the fourth day, they find that the well is completely dry. The father decides they must abandon the farm; the two pack and depart with a pushcart. Since the horse refuses to work, the daughter pushes the cart instead, with the horse following on a lead. Shortly after setting out, they mysteriously find themselves back where they started ... and unpack.\nOn the fifth day, they find the horse is unwell (perhaps dying) and not fit to work. The father removes the horse's reins and leaves it in the barn. The father and daughter then stay indoors for the day, with the wind continuing howling outside. In the evening, the sunlight outside suddenly disappears and the house is plunged into darkness. The daughter lights lanterns around the house to illuminate their surroundings. Some time later, the lanterns also suddenly fail, leaving them in total darkness. On the sixth day, there are no howling winds or sunlight. Now subsisting on raw potatoes, the daughter refuses to eat or talk, seemingly resigning to her fate. The father appears to follow, not finishing his potato and sitting with his daughter in silence." },
  { rank: 71, title: "Werckmeister Harmonies", director: "B\u00e9la Tarr", year: 2000, country: "Hungary", genre: "Drama/Mystery", runtime: 145, criterion: "https://www.criterion.com/films/33388-werckmeister-harmonies", poster: "https://s3.amazonaws.com/criterion-production/films/4685c626c6c288958660886bf31ca96e/fdL4eOWxwyJhsalqklpRacuoyL1Fvs_medium.jpg", price: 24.99, amazon: "https://www.amazon.com/dp/B0CSL9H2BS", plot: "This mesmeric parable of societal collapse is an enigma of transcendent visual, philosophical, and mystical resonance. Adapted from a novel by L\u00e1szl\u00f3 Krasznahorkai, Werckmeister Harmonies unfolds in an unknown time in an unnamed village, where, one day, a mysterious circus\u2014complete with an enormous stuffed whale and a shadowy, demagogue-like figure known as the Prince\u2014arrives and appears to awaken a kind of madness in the citizens that builds inexorably toward violence. In thirty-nine hypnotic long takes engraved in ghostly black and white, auteur B\u00e9la Tarr and codirector-editor \u00c1gnes Hranitzky conjure an apocalyptic vision of dreamlike dread and fathomless beauty." },
  { rank: 72, title: "Army of Shadows", director: "Jean-Pierre Melville", year: 1969, country: "France", genre: "Drama/War", runtime: 145, criterion: "https://www.criterion.com/films/153-army-of-shadows", poster: "https://s3.amazonaws.com/criterion-production/films/c9f771825b3863450ecfec9e8b440f05/YKQb8TICsflKZMMU2SEbsOH8x5eZrj_medium.jpg", price: 14.99, amazon: "https://www.amazon.com/dp/B083XTS7QV", plot: "The most personal film by the underworld poet Jean-Pierre Melville, who had participated in the French Resistance himself, this tragic masterpiece, based on a novel by Joseph Kessel, recounts the struggles and sacrifices of those who fought in the Resistance. Lino Ventura, Paul Meurisse, Jean-Pierre Cassel, and the incomparable Simone Signoret star as intrepid underground fighters who must grapple with their conception of honor in their battle against Hitler\u2019s regime. Long underappreciated in France and unseen in the United States, the atmospheric and gripping thriller Army of Shadows is now widely recognized as the summit of Melville\u2019s career, channeling the exquisite minimalism of his gangster films to create an unsparing tale of defiance in the face of seemingly insurmountable odds." },
  { rank: 73, title: "Le Samoura\u00ef", director: "Jean-Pierre Melville", year: 1967, country: "France", genre: "Crime/Thriller", runtime: 105, criterion: "https://www.criterion.com/films/184-le-samourai", poster: "https://s3.amazonaws.com/criterion-production/films/27db58e44fb4dde2f6501f6f01ff4db4/JgSK0D7xLjHMKNvrYplGmlZ6Wn5bxh_medium.jpg", price: 24.99, amazon: "https://www.amazon.com/dp/B0D1YJ6Z72", plot: "In a career-defining performance, Alain Delon plays Jef Costello, a contract killer with samurai instincts. After carrying out a flawlessly planned hit, Jef finds himself caught between a persistent police investigator and a ruthless employer, and not even his armor of fedora and trench coat can protect him. An elegantly stylized masterpiece of cool by maverick director Jean\u2011Pierre Melville, Le samoura\u00ef is a razor-sharp cocktail of 1940s American gangster cinema and 1960s French pop culture \u2014with a liberal dose of Japanese lone-warrior mythology." },
  { rank: 74, title: "Bob le Flambeur", director: "Jean-Pierre Melville", year: 1956, country: "France", genre: "Crime/Drama", runtime: 98, criterion: "https://www.criterion.com/films/690-bob-le-flambeur", poster: "https://s3.amazonaws.com/criterion-production/films/2531310c0df8d296ad19d373c750edcd/81GjqpAeXsfQORks7Vpmpgjmnwub6u_medium.jpg", price: 55.0, amazon: "https://www.amazon.com/dp/B0000633SC", plot: "Suffused with wry humor, Jean-Pierre Melville\u2019s Bob le flambeur melds the toughness of American gangster films with Gallic sophistication to lay the road map for the French New Wave. As the neon is extinguished for another dawn, an aging gambler navigates the treacherous world of pimps, moneymen, and naive associates while plotting one last score\u2014the heist of the Deauville casino. This underworld comedy of manners possesses all the formal beauty, finesse, and treacherous allure of green baize." },
  { rank: 75, title: "The Wages of Fear", director: "Henri-Georges Clouzot", year: 1953, country: "France/Italy", genre: "Thriller", runtime: 131, criterion: "https://www.criterion.com/films/370-the-wages-of-fear", poster: "https://s3.amazonaws.com/criterion-production/films/b7658ce24f48a698ff2076d29c2b89a7/yP5oH2wWKcKmJbSxJNf9UVhELk6znE_medium.jpg", price: 39.95, amazon: "https://www.amazon.com/dp/B0DQF2HH1P", plot: "In a squalid South American oil town, four desperate men sign on for a suicide mission to drive trucks loaded with nitroglycerin over a treacherous mountain route. As they ferry their explosive cargo to a faraway oil fire, each bump and jolt tests their courage, their friendship, and their nerves. The result is one of the greatest thrillers ever committed to celluloid, a white-knuckle ride from France\u2019s legendary master of suspense Henri-Georges Clouzot." },
  { rank: 76, title: "Diabolique", director: "Henri-Georges Clouzot", year: 1955, country: "France", genre: "Horror/Thriller", runtime: 117, criterion: "https://www.criterion.com/films/575-diabolique", poster: "https://s3.amazonaws.com/criterion-production/films/8ad483e8370aa256e8c9ca948661a23f/9hcuAM2tFd0symu9gCWBOnJWhVBXKJ_medium.jpg", price: 19.99, amazon: "https://www.amazon.com/dp/B004NWPY1Q", plot: "Before Psycho, Peeping Tom, and Repulsion, there was Diabolique. This thriller from Henri\u2011Georges Clouzot, which shocked audiences in Europe and the U.S., is the story of two women\u2014the fragile wife and the willful mistress of the sadistic headmaster of a boys' boarding school\u2014who hatch a daring revenge plot. With its unprecedented narrative twists and terrifying images, Diabolique is a heart-grabbing benchmark in horror filmmaking, featuring outstanding performances by Simone Signoret, V\u00e9ra Clouzot, and Paul Meurisse." },
  { rank: 77, title: "Ugetsu", director: "Kenji Mizoguchi", year: 1953, country: "Japan", genre: "Drama/Romance", runtime: 107, criterion: "https://www.criterion.com/films/369-ugetsu", poster: "https://s3.amazonaws.com/criterion-production/films/c66a1a1981439219be0c6124cebbf6ad/0mD8mQfefSRAootfVPdmKFCJcNK5rq_medium.jpg", plot: "By the time he made Ugetsu, Kenji Mizoguchi was already an elder statesman of Japanese cinema, fiercely revered by Akira Kurosawa and other directors of a younger generation. And with this exquisite ghost story, a fatalistic wartime tragedy derived from stories by Akinari Ueda and Guy de Maupassant, he created a touchstone of his art, his long takes and sweeping camera guiding the viewer through a delirious narrative about two villagers whose pursuit of fame and fortune leads them far astray from their loyal wives. Moving between the terrestrial and the otherworldly, Ugetsu reveals essential truths about the ravages of war, the plight of women, and the pride of men. Ugetsu was restored by The Film Foundation and Kadokawa Corporation at Cineric Laboratories in New York. Special thanks to Masahiro Miyajima and Martin Scorsese for their consultation on this restoration. Restoration funding " },
  { rank: 78, title: "Beauty and the Beast", director: "Jean Cocteau", year: 1946, country: "France", genre: "Fantasy/Romance", runtime: 93, criterion: "https://www.criterion.com/films/177-beauty-and-the-beast", poster: "https://s3.amazonaws.com/criterion-production/films/a2938bd71e5137c9b033805dbc52acda/yOpwpNKPX8pAxfPd7tLOaWMjzjTwFS_medium.jpg", price: 19.99, amazon: "https://www.amazon.com/dp/B004WPYO8I", plot: "Jean Cocteau\u2019s sublime adaptation of Mme. Leprince de Beaumont\u2019s fairy-tale masterpiece\u2014in which the pure love of a beautiful girl melts the heart of a feral but gentle beast\u2014is a landmark of motion picture fantasy, with unforgettably romantic performances by Jean Marais and Josette Day. The spectacular visions of enchantment, desire, and death in Beauty and the Beast (La Belle et la B\u00eate) have become timeless icons of cinematic wonder." },
  { rank: 79, title: "Orpheus", director: "Jean Cocteau", year: 1950, country: "France", genre: "Fantasy/Drama", runtime: 95, criterion: "https://www.criterion.com/films/610-orpheus", poster: "https://s3.amazonaws.com/criterion-production/films/a28ec0dd0864fa570a2c8183875b1054/YAlnMCnVpvIjnVQKeWwArpEoPKBSBb_medium.jpg", price: 19.99, amazon: "https://www.amazon.com/dp/B005152CBE", plot: "Jean Cocteau\u2019s update of the Orpheus myth depicts a famous poet (Jean Marais), scorned by the Left Bank youth, and his love for both his wife, Eurydice (Marie D\u00e9a), and a mysterious princess (Maria Casar\u00e8s). Seeking inspiration, the poet follows the princess from the world of the living to the land of the dead, through Cocteau\u2019s famous mirrored portal. Orpheus\u2019s peerless visual poetry and dreamlike storytelling represent the legendary Cocteau at the height of his powers." },
  { rank: 80, title: "Children of Paradise", director: "Marcel Carn\u00e9", year: 1945, country: "France", genre: "Drama/Romance", runtime: 190, criterion: "https://www.criterion.com/films/683-children-of-paradise", poster: "https://s3.amazonaws.com/criterion-production/films/2d9f026ba2ed7a6a778659322439ef90/RdeFsW6ga3pD4eGAnCIv97Q5bJV6pF_medium.jpg", price: 19.99, amazon: "https://www.amazon.com/dp/B008CJ0JR0", plot: "Poetic realism reached sublime heights with Children of Paradise, widely considered one of the greatest French films of all time. This nimble depiction of nineteenth-century Paris\u2019s theatrical demimonde, filmed during World War II, follows a mysterious woman (Arletty) loved by four different men (all based on historical figures): an actor, a criminal, a count, and, most poignantly, a mime (Jean-Louis Barrault, in a longing-suffused performance for the ages). With sensitivity and dramatic \u00e9lan, director Marcel Carn\u00e9 and screenwriter Jacques Pr\u00e9vert resurrect a world teeming with hucksters and aristocrats, thieves and courtesans, pimps and seers. And thanks to a major new restoration, this iconic classic looks and sounds richer and more detailed than ever." },
  { rank: 81, title: "Port of Shadows", director: "Marcel Carn\u00e9", year: 1938, country: "France", genre: "Drama/Romance", runtime: 91, criterion: "https://www.criterion.com/films/947-port-of-shadows", poster: "https://s3.amazonaws.com/criterion-production/films/bf4fa213775dfb28b88fec3cf7e591f3/npz6imAc55viSlErqx5RV1pItUSk2B_medium.jpg", price: 48.53, amazon: "https://www.amazon.com/dp/B00026L74U", plot: "Down a foggy, desolate road to the port city of Le Havre travels Jean (Jean Gabin), an army deserter looking for another chance to make good on life. Fate, however, has a different plan for him, as acts of both revenge and kindness render him front-page news. Also starring the blue-eyed phenomenon Mich\u00e8le Morgan in her first major role, and the menacing Michel Simon, Port of Shadows (Le Quai des brumes) starkly portrays an underworld of lonely souls wrestling with their own destinies. Based on the novel by Pierre Mac Orlan, the inimitable team of director Marcel Carn\u00e9 and writer Jacques Pr\u00e9vert deliver a quintessential example of poetic realism and a classic film from the golden age of French cinema." },
  { rank: 82, title: "Grand Illusion", director: "Jean Renoir", year: 1937, country: "France", genre: "War/Drama", runtime: 114, criterion: "https://www.criterion.com/films/351-grand-illusion", poster: "https://s3.amazonaws.com/criterion-production/films/b41a9467bc7a3534c01ba037c019005c/L5fZBJQOnY606k47INf8z9f5ecBFn3_medium.jpg", plot: "One of the very first prison escape movies, Grand Illusion is hailed as one of the greatest films ever made. Jean Renoir's antiwar masterpiece stars Jean Gabin and Pierre Fresnay as French soldiers held in a World War I German prison camp, and Erich von Stroheim as the unforgettable Captain von Rauffenstein." },
  { rank: 83, title: "The Discreet Charm of the Bourgeoisie", director: "Luis Bu\u00f1uel", year: 1972, country: "France", genre: "Comedy/Surrealism", runtime: 102, criterion: "https://www.criterion.com/films/310-the-discreet-charm-of-the-bourgeoisie", poster: "https://s3.amazonaws.com/criterion-production/films/ec5399163d6dca9c04ee961a15f1c863/JegycjW6BfTUczUHnh51sLyJCVKQoy_medium.jpg", price: 49.99, amazon: "https://www.amazon.com/dp/B00004Z1FM", plot: "In Luis Bu\u00f1uel\u2019s deliciously satiric masterpiece, an upper-middle-class sextet sits down to a dinner that is continually delayed, their attempts to eat thwarted by vaudevillian events both actual and imagined, including terrorist attacks, military maneuvers, and ghostly apparitions. Stringing together a discontinuous, digressive series of absurdist set pieces, Bu\u00f1uel and his screenwriting partner Jean-Claude Carri\u00e8re send a cast of European-film greats\u2014including Fernando Rey, St\u00e9phane Audran, Delphine Seyrig, Jean-Pierre Cassel, and Bulle Ogier\u2014through a maze of desire deferred, frustrated, and interrupted. The Oscar-winning pinnacle of Bu\u00f1uel\u2019s late-career ascent as a feted maestro of the international art house, The Discreet Charm of the Bourgeoisie is also one of his most gleefully radical assaults on the values of the ruling class." },
  { rank: 84, title: "Viridiana", director: "Luis Bu\u00f1uel", year: 1961, country: "Spain/Mexico", genre: "Drama", runtime: 90, criterion: "https://www.criterion.com/films/373-viridiana", poster: "https://s3.amazonaws.com/criterion-production/films/099cc1190fd60561da5b27798bd03237/FqqE91BPBcvRJFfZzF6pxbMdzrnLcS_medium.jpg", price: 32.28, amazon: "https://www.amazon.com/dp/B0G84LGK3Q", plot: "Banned in Spain and denounced by the Vatican upon its premiere, Luis Bu\u00f1uel\u2019s irreverent vision of life as a beggar\u2019s banquet is regarded by many as his masterpiece. In it, novice nun Viridiana (Silvia Pinal) does her utmost to maintain her Catholic principles, but her lecherous uncle (Fernando Rey) and a motley assemblage of paupers force her to confront the limits of her idealism. Winner of the Palme d\u2019Or at the 1961 Cannes Film Festival, Viridiana is as audacious today as ever." },
  { rank: 85, title: "Belle de Jour", director: "Luis Bu\u00f1uel", year: 1967, country: "France", genre: "Drama/Romance", runtime: 100, criterion: "https://www.criterion.com/films/27949-belle-de-jour", poster: "https://s3.amazonaws.com/criterion-production/films/ea08b0b7f8f9cd31e39a14bfa36e95a8/2emaq5HhNTvZEejNqAL74jOsL3W9B2_medium.jpg", price: 19.99, amazon: "https://www.amazon.com/dp/B005VU9LI6", plot: "Catherine Deneuve\u2019s porcelain perfection hides a cracked interior in one of the actress\u2019s most iconic roles: S\u00e9verine, a Paris housewife who begins secretly spending her after\u00adnoon hours working in a bordello. This surreal and erotic late-sixties daydream from provocateur for the ages Luis Bu\u00f1uel is an examination of desire and fetishistic pleasure (its characters\u2019 and its viewers\u2019), as well as a gently absurdist take on contemporary social mores and class divisions. Fantasy and reality commingle in this burst of cinematic transgression, which was one of Bu\u00f1uel\u2019s biggest hits." },
  { rank: 86, title: "The Exterminating Angel", director: "Luis Bu\u00f1uel", year: 1962, country: "Mexico", genre: "Comedy/Drama", runtime: 95, criterion: "https://www.criterion.com/films/1076-the-exterminating-angel", poster: "https://s3.amazonaws.com/criterion-production/films/cda5446e826e520f328e997ad815c538/1EcnbVyDTbLAxNURdk0Y8bnIojE1pY_medium.jpg", price: 19.99, amazon: "https://www.amazon.com/dp/B01LZT5R4X", plot: "A group of high-society friends are invited to a mansion for dinner and find themselves inexplicably unable to leave, in Luis Bu\u00f1uel\u2019s daring masterpiece The Exterminating Angel (El \u00e1ngel exterminador). Made just one year after the director\u2019s inter\u00adna\u00adtional sensation Viridiana, this film, full of eerie comic absurdity, continues Bu\u00f1uel\u2019s wicked takedown of the rituals and dependencies of the frivolous upper classes." },
  { rank: 87, title: "Wings of Desire", director: "Wim Wenders", year: 1987, country: "West Germany", genre: "Fantasy/Romance", runtime: 128, criterion: "https://www.criterion.com/films/200-wings-of-desire", poster: "https://s3.amazonaws.com/criterion-production/films/12b76bc360f9bc4f32f90fa0edd732ff/HRUUfXVsjmvKDOhzr9UfufiLT25yFV_medium.jpg", price: 29.99, amazon: "https://www.amazon.com/dp/B002IVDLGE", plot: "Wings of Desire is one of cinema\u2019s loveliest city symphonies. Bruno Ganz is Damiel, an angel perched atop buildings high over Berlin who can hear the thoughts\u2014fears, hopes, dreams\u2014of all the people living below. But when he falls in love with a beautiful trapeze artist, he is willing to give up his immortality and come back to earth to be with her. Made not long before the fall of the Berlin Wall, this stunning tapestry of sounds and images, shot in black and white and color by the legendary Henri Alekan, forever made the name of director Wim Wenders synonymous with film art." },
  { rank: 88, title: "Paris, Texas", director: "Wim Wenders", year: 1984, country: "West Germany/France", genre: "Drama", runtime: 145, criterion: "https://www.criterion.com/films/1502-paris-texas", poster: "https://s3.amazonaws.com/criterion-production/films/f2d271896fa3215c5eafafca0ba42a43/I3doHb7CxRFjiAeQr2b26meVAELksg_medium.jpg", plot: "New German Cinema pioneer Wim Wenders brings his keen eye for landscape to the American Southwest in Paris, Texas, a profoundly moving character study written by Pulitzer Prize\u2013winning playwright Sam Shepard. Paris, Texas follows the mysterious, nearly mute drifter Travis (a magnificent Harry Dean Stanton, whose face is a landscape all its own) as he tries to reconnect with his young son, living with his brother (Dean Stockwell) in Los Angeles, and his missing wife (Nastassja Kinski). From this simple setup, Wenders and Shepard produce a powerful statement on codes of masculinity and the myth of the American family, as well as an exquisite visual exploration of a vast, crumbling world of canyons and neon." },
  { rank: 89, title: "The American Friend", director: "Wim Wenders", year: 1977, country: "West Germany", genre: "Crime/Drama", runtime: 125, criterion: "https://www.criterion.com/films/28763-the-american-friend", poster: "https://s3.amazonaws.com/criterion-production/films/bfc170fd79de2f1298ae0115534a9594/YIHd0ub4uOeANf4KvdgkkwZFqg0p6D_medium.jpg", price: 19.96, amazon: "https://www.amazon.com/dp/B016R7C3LS", plot: "Wim Wenders pays loving homage to rough-and-tumble Hollywood film noir with The American Friend, a loose adaptation of Patricia Highsmith\u2019s novel Ripley\u2019s Game. Dennis Hopper oozes quirky menace as an amoral American art dealer who entangles a terminally ill German everyman, played by Bruno Ganz, in a seedy criminal underworld as revenge for a personal slight\u2014but when the two become embroiled in an ever-deepening murder plot, they form an unlikely bond. Filmed on location in Hamburg and Paris, with some scenes shot in grimy, late-seventies New York City, Wenders\u2019s international breakout is a stripped-down crime story that mixes West German and American film flavors, and it features cameos by filmmakers Jean Eustache, Samuel Fuller, and Nicholas Ray." },
  { rank: 90, title: "M", director: "Fritz Lang", year: 1931, country: "Germany", genre: "Crime/Thriller", runtime: 99, criterion: "https://www.criterion.com/films/621-hamlet", poster: "https://s3.amazonaws.com/criterion-production/films/2f448c30ac7b06febb22d66b5ff974a7/IbyM57yhe0Whunlq0YhnaVhNeqD9Hi_medium.jpg", price: 32.28, amazon: "https://www.amazon.com/dp/B00393SFU2", plot: "Winner of four Academy Awards, including Best Picture and Best Actor, Sir Laurence Olivier\u2019s Hamlet continues to be the most compelling version of Shakespeare\u2019s beloved tragedy. Olivier is at his most inspired\u2014both as director and as the melancholy Dane himself\u2014as he breathes new life into the words of one of the world\u2019s greatest dramatists." },
  { rank: 91, title: "Metropolis", director: "Fritz Lang", year: 1927, country: "Germany", genre: "Sci-Fi", runtime: 153, plot: "In a dystopian world, wealthy industrialists and business magnates and their top employees reign over the city of Metropolis from colossal skyscrapers, while underground-dwelling workers toil to operate the great machines that power it. Joh Fredersen is the city's master. His son, Freder, idles away his time at sports and in a pleasure garden, but is interrupted by the arrival of a young woman named Maria, who has brought a group of workers' children to witness the lifestyle of their rich \"brothers\".\nMaria and the children are ushered away, but Freder becomes fascinated by her. Against the strict rules of the city, he enters the lower levels to search for her. In the machine halls, he witnesses the explosion of a huge machine that kills and injures numerous workers. Freder has a hallucination that the machine is a temple of Moloch and the workers are being fed to it. When the hallucination ends, and he sees the dead workers being carried away on stretchers, he rushes to tell his father about the accident.\nGrot, foreman of the Heart Machine, brings Fredersen two maps found in the dead workers' pockets. Fredersen fires his assistant Josaphat for not being the first to bring him details about the explosion or the maps. After seeing his father's cold indifference towards the harsh conditions faced by the workers, Freder secretly rebels by deciding to help them. He enlists Josaphat's assistance and returns to the machine halls, taking the place of a worker who has collapsed from exhaustion.\n\nFredersen takes the maps to the city's greatest inventor, Rotwang, to learn their meaning. Rotwang had been in love with a woman named Hel, who left him to marry Fredersen and later died giving birth to Freder. Rotwang shows Fredersen a robot he has built to \"resurrect\" Hel. The maps show a network of catacombs beneath Metropolis, and the two men go to investigate. They eavesdrop on a gathering of workers, including Freder. Maria addresses them, prophesying the arrival of a mediator who can bring the working and ruling classes together. Freder believes he can fill the role and declares his love for Maria.\nFredersen orders Rotwang to give Maria's likeness to the robot so that it can discredit her among the workers, but is unaware of Rotwang's true plan to destroy Metropolis and kill Freder in revenge. Rotwang kidnaps Maria, fashions the robot in her image, and presents her to Fredersen. Freder finds the two embracing and, believing his father to have betrayed him, falls into a prolonged delirium. The false Maria dances sensuously at Rotwang's house and the Yoshiwara club, causing mayhem\u2014the wealthy men do not recognize she is a machine. Intercut with Freder's hallucinations, the false Maria preaches to the workers that they must rise up against the surface world, resulting in chaos and dissent.\nFreder recovers and returns to the catacombs, accompanied by Josaphat. Finding the false Maria urging the workers to destroy the machines, he accuses her of not being the real Maria. The workers ignore him and carry out her wishes, smashing the machines and triggering a great flood in their underground city that threatens to drown their children. Fredersen and Rotwang struggle, and the real Maria, having escaped from Rotwang's house, rescues the children with help from Freder and Josaphat. Grot berates the celebrating workers for abandoning their children in the flood. The workers become hysterical and condemn the false Maria, burning her at the stake. A horrified Freder watches until the fire reveals her to be a robot. Rotwang, now suffering from a delusion that Maria is Hel, chases her to the roof of the cathedral, pursued by Freder. The two men fight as Fredersen and the workers watch from the street, and Rotwang falls to his death. Freder fulfills his destiny to unite the two halves of Metropolis' society by linking the hands of Fredersen and Grot to bring them together." },
  { rank: 92, title: "The Testament of Dr. Mabuse", director: "Fritz Lang", year: 1933, country: "Germany", genre: "Crime/Thriller", runtime: 121, criterion: "https://www.criterion.com/films/721-the-testament-of-dr-mabuse", poster: "https://s3.amazonaws.com/criterion-production/films/54c721d65e42f080484dba5bb409daf0/j2sPOa4CCiMyJefg5DNy4uJraAbCCe_medium.jpg", price: 32.28, amazon: "https://www.amazon.com/dp/B0001UZZS6", plot: "Locked away in an asylum for a decade and teetering between life and death, the criminal mastermind Doctor Mabuse (Rudolf Klein-Rogge) has scribbled his last will and testament: a manifesto establishing a future empire of crime. When the document\u2019s nefarious writings start leading to terrifying parallels in reality, it\u2019s up to Berlin\u2019s star detective, Inspector Lohmann (Otto Wernicke, reprising his role from M) to connect the most fragmented, maddening clues in a case unlike any other. A sequel to his enormously successful silent film Dr. Mabuse: The Gambler, Fritz Lang's The Testament of Dr. Mabuse reunites the director with the character that had effectively launched his career. Lang put slogans and ideas expounded by the Nazis into the mouth of a madman, warning his audience of an imminent menace, which was soon to become a reality. Nazi Minister of Information Joseph Goebbels saw the" },
  { rank: 93, title: "The Third Man", director: "Carol Reed", year: 1949, country: "UK", genre: "Film Noir/Mystery", runtime: 104, criterion: "https://www.criterion.com/films/236-the-third-man", poster: "https://s3.amazonaws.com/criterion-production/films/1283a2e6f60a395e2afb5f75a72b160f/Innqqmp9vKKQMgQnrzkyHERGrs480H_medium.jpg", price: 40.21, amazon: "https://www.amazon.com/dp/B000025RE7", plot: "Pulp novelist Holly Martins travels to shadowy, postwar Vienna, only to find himself investigating the mysterious death of an old friend, black-market opportunist Harry Lime\u2014and thus begins this legendary tale of love, deception, and murder. Thanks to brilliant performances by Joseph Cotten, Alida Valli, and Orson Welles; Anton Karas's evocative zither score; Graham Greene\u2019s razor-sharp dialogue; and Robert Krasker\u2019s dramatic use of light and shadow, The Third Man, directed by the inimitable Carol Reed, only grows in stature as the years pass." },
  { rank: 94, title: "Brief Encounter", director: "David Lean", year: 1945, country: "UK", genre: "Drama/Romance", runtime: 86, criterion: "https://www.criterion.com/films/345-brief-encounter", poster: "https://s3.amazonaws.com/criterion-production/films/b1934b4748475590262b938b9cfc3c4a/w7dChuHNMJFqP6lR0le67x1rix4DQu_medium.jpg", plot: "After a chance meeting on a train platform, a married doctor (Trevor Howard) and a suburban housewife (Celia Johnson) begin a muted but passionate, and ultimately doomed, love affair. With its evocatively fog-enshrouded setting, swooning Rachmaninoff score, and pair of remarkable performances (Johnson was nominated for an Oscar), this film, directed by David Lean and based on No\u00ebl Coward\u2019s play Still Life deftly explores the thrill, pain, and tenderness of an illicit romance, and has influenced many a cinematic brief encounter since its release." },
  { rank: 95, title: "The Red Shoes", director: "Michael Powell & Emeric Pressburger", year: 1948, country: "UK", genre: "Drama/Fantasy", runtime: 136, criterion: "https://www.criterion.com/films/233-the-red-shoes", poster: "https://s3.amazonaws.com/criterion-production/films/daa1d614942bb086b7fa4d4e1eb8b0d0/aZoMem6iPcKUSkCDO0g26e1bKiwA8y_medium.jpg", plot: "The Red Shoes, the singular fantasia from Michael Powell and Emeric Pressburger, is cinema\u2019s quintessential backstage drama, as well as one of the most glorious Technicolor feasts ever concocted for the screen. Moira Shearer is a rising star ballerina torn between an idealistic composer and a ruthless impresario intent on perfection. Featuring outstanding performances, blazingly beautiful cinematography by Jack Cardiff, Oscar-winning sets and music, and an unforgettable, hallucinatory central dance sequence, this beloved classic, dazzlingly restored, stands as an enthralling tribute to the life of the artist. The Red Shoes was restored by the UCLA Film & Television Archive in association with the BFI, The Film Foundation, ITV Global Entertainment Ltd., and Janus Films. Restoration funding provided by the Hollywood Foreign Press Association, The Film Foundation, and the Louis B. Mayer Fou" },
  { rank: 96, title: "Black Narcissus", director: "Michael Powell & Emeric Pressburger", year: 1947, country: "UK", genre: "Drama", runtime: 101, criterion: "https://www.criterion.com/films/632-black-narcissus", poster: "https://s3.amazonaws.com/criterion-production/films/c2a614703cc6b07a7b3446e218bf4f06/1GGBmkMqFTNQpPngTALkhW66O6cKMi_medium.jpg", price: 32.2, amazon: "https://www.amazon.com/dp/B003ICZW78", plot: "This explosive work about the conflict between the spirit and the flesh is the epitome of the sensuous style of Michael Powell and Emeric Pressburger. A group of nuns\u2014played by some of Britain\u2019s finest actresses, including Deborah Kerr, Kathleen Byron, and Flora Robson\u2014struggle to establish a convent in the Himalayas, while isolation, extreme weather, altitude, and culture clashes all conspire to drive the well-intentioned missionaries mad. A darkly grand film that won Oscars for Alfred Junge's art direction and Jack Cardiff's cinematography, Black Narcissus is one of the greatest achievements by two of cinema\u2019s true visionaries." },
  { rank: 97, title: "Peeping Tom", director: "Michael Powell", year: 1960, country: "UK", genre: "Horror/Thriller", runtime: 101, criterion: "https://www.criterion.com/films/235-peeping-tom", poster: "https://s3.amazonaws.com/criterion-production/films/6724d7a97aa8fc2e8dd892f07c4d4c4f/unzQLMlUZtZU0z52W0WcCVJeek4NCO_medium.jpg", price: 19.98, amazon: "https://www.amazon.com/dp/B0CVYNHMR4", plot: "Having brought British cinema into exalted realms of fantasy and imagination, Michael Powell took a dark detour into obsession, voyeurism, and violence with this groundbreaking metacinematic investigation into the mechanics of fear. Armed with his killer camera, photog rapher and filmmaker Mark Lewis (Carl Boehm) unleashes the traumas of his childhood by murdering women and recording their deaths\u2014until he falls for his downstairs neighbor, and finds himself struggling against his dark compulsions. Received with revulsion upon its release only to be reclaimed as a masterpiece, the endlessly analyzed, still-shocking Peeping Tom dares viewers to confront their own relationship to the violence on-screen." },

const STORAGE_KEY = 'criterion-watched-v1';

function getWatched() {
  try { return new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]')); }
  catch { return new Set(); }
}

function setWatched(set) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify([...set]));
}

function slug(t) { return t.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, ''); }
function searchLink(title) { return 'https://www.google.com/search?q=' + encodeURIComponent(title + ' Criterion Collection'); }
function justwatchLink(title) { return 'https://www.justwatch.com/us/search?q=' + encodeURIComponent(title); }

function render() {
  const query = document.getElementById('search').value.trim().toLowerCase();
  const filter = document.getElementById('filter').value;
  const sort = document.getElementById('sort').value;
  const watched = getWatched();

  let list = films.slice();
  if (query) {
    list = list.filter(f => f.title.toLowerCase().includes(query) || f.director.toLowerCase().includes(query) || f.country.toLowerCase().includes(query) || f.genre.toLowerCase().includes(query));
  }
  if (filter === 'watched') list = list.filter(f => watched.has(f.rank));
  if (filter === 'unwatched') list = list.filter(f => !watched.has(f.rank));

  if (sort === 'year') list.sort((a, b) => a.year - b.year);
  else if (sort === 'title') list.sort((a, b) => a.title.localeCompare(b.title));
  else if (sort === 'price') list.sort((a, b) => (a.price ?? Infinity) - (b.price ?? Infinity));
  else list.sort((a, b) => a.rank - b.rank);

  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  if (!list.length) {
    grid.innerHTML = '<div class="empty">No films match your search.</div>';
  }
  list.forEach(f => {
    const isWatched = watched.has(f.rank);
    const el = document.createElement('article');
    el.className = 'card' + (isWatched ? ' watched' : '');
    el.innerHTML = `
      <button class="check-btn" data-rank="${f.rank}" title="Toggle watched" aria-label="Toggle watched">✓</button>
      ${f.poster ? `<img class="poster" src="${f.poster}" alt="" loading="lazy" onerror="this.style.display='none'">` : ''}
      <div class="info">
        <div class="title">#${f.rank} ${f.title}</div>
        <div class="meta"><span>${f.year}</span><span>${f.director}</span><span>${f.country}</span><span>${f.runtime} min</span>${f.price != null ? `<span class="price">$${f.price.toFixed(2)}${f.fmt ? ' ' + f.fmt : ''}</span>` : ''}</div>
        <div class="tags"><span class="tag">${f.genre}</span></div>
        ${f.plot ? `<button class="plot-toggle" data-rank="${f.rank}">Plot ▾</button><p class="plot">${f.plot}</p>` : ''}
        <div class="links">
          <a href="${f.criterion || searchLink(f.title)}" target="_blank" rel="noopener">Criterion</a>
          <a href="${justwatchLink(f.title)}" target="_blank" rel="noopener">Where to watch</a>
          ${f.amazon ? `<a href="${f.amazon}" target="_blank" rel="noopener">Amazon${f.price != null ? ' $' + f.price.toFixed(2) : ''}</a>` : ''}
        </div>
      </div>
    `;
    grid.appendChild(el);
  });

  document.getElementById('total-count').textContent = films.length;
  document.getElementById('watched-count').textContent = watched.size;
  document.getElementById('remaining-count').textContent = films.length - watched.size;

  document.querySelectorAll('.check-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const rank = Number(btn.dataset.rank);
      const w = getWatched();
      if (w.has(rank)) w.delete(rank); else w.add(rank);
      setWatched(w);
      render();
    });
  });

  document.querySelectorAll('.plot-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const p = btn.nextElementSibling;
      const open = p.classList.toggle('open');
      btn.textContent = open ? 'Plot ▴' : 'Plot ▾';
    });
  });
}

document.getElementById('search').addEventListener('input', render);
document.getElementById('filter').addEventListener('change', render);
document.getElementById('sort').addEventListener('change', render);
document.getElementById('reset').addEventListener('click', () => {
  if (confirm('Clear all watched marks?')) { setWatched(new Set()); render(); }
});

render();
</script>
</body>
</html>
