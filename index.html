<style>
:root {
  --bg: #0f1115;
  --card: #181b21;
  --text: #e6e6e6;
  --muted: #9aa0a6;
  --accent: #ff6f3c;
  --accent2: #ff9f1c;
  --watched: #2e7d32;
  --border: #2a2e36;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
}
header {
  padding: 2rem 1rem;
  text-align: center;
  background: linear-gradient(135deg, #1a1d23 0%, #0f1115 100%);
  border-bottom: 1px solid var(--border);
}
h1 { margin: 0 0 .5rem; font-size: 1.8rem; }
.subtitle { color: var(--muted); font-size: .95rem; }
.stats {
  display: flex;
  justify-content: center;
  gap: 1.5rem;
  margin-top: 1rem;
  font-size: .9rem;
}
.stat strong { color: var(--accent2); }
.controls {
  max-width: 900px;
  margin: 1.5rem auto 0;
  display: flex;
  gap: .75rem;
  flex-wrap: wrap;
  justify-content: center;
  padding: 0 1rem;
}
input, select, button {
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--text);
  padding: .6rem .8rem;
  border-radius: 8px;
  font: inherit;
}
input { min-width: 220px; }
button { cursor: pointer; transition: background .15s; }
button:hover { background: #22262e; }
.grid {
  max-width: 1100px;
  margin: 2rem auto;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 1rem;
  padding: 0 1rem 3rem;
}
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 1rem;
  display: flex;
  gap: 1rem;
  align-items: flex-start;
  transition: transform .1s, border-color .1s;
}
.card:hover { border-color: var(--accent); transform: translateY(-2px); }
.card.watched { opacity: .55; border-color: var(--watched); }
.card.watched .check-btn { background: var(--watched); border-color: var(--watched); }
.check-btn {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 2px solid var(--muted);
  background: transparent;
  color: transparent;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  cursor: pointer;
  padding: 0;
}
.check-btn:hover { border-color: var(--accent2); }
.card.watched .check-btn { color: #fff; }
.poster {
  width: 74px;
  height: 108px;
  object-fit: cover;
  border-radius: 6px;
  flex-shrink: 0;
  border: 1px solid var(--border);
  background: #23272f;
}
.info { flex: 1; }
.title { font-weight: 700; font-size: 1.05rem; margin: 0 0 .2rem; }
.meta { color: var(--muted); font-size: .85rem; margin-bottom: .5rem; }
.meta span:not(:last-child)::after { content: " • "; color: #555; }
.tags { display: flex; flex-wrap: wrap; gap: .35rem; }
.tag {
  font-size: .72rem;
  background: #23272f;
  padding: .2rem .5rem;
  border-radius: 99px;
  color: var(--muted);
}
.links { margin-top: .6rem; }
.links a {
  font-size: .8rem;
  color: var(--accent);
  text-decoration: none;
  margin-right: .75rem;
}
.links a:hover { text-decoration: underline; }
.empty {
  text-align: center;
  color: var(--muted);
  padding: 3rem 1rem;
  grid-column: 1 / -1;
}
footer {
  text-align: center;
  color: var(--muted);
  font-size: .8rem;
  padding: 2rem 1rem;
  border-top: 1px solid var(--border);
}
</style>
</head>

const STORAGE_KEY = 'criterion-watched-v1';

function getWatched() {
  try { return new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]')); }
  catch { return new Set(); }
}

function setWatched(set) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify([...set]));
}

function slug(t) { return t.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, ''); }
function searchLink(title) { return 'https://www.google.com/search?q=' + encodeURIComponent(title + ' Criterion Collection'); }
function justwatchLink(title) { return 'https://www.justwatch.com/us/search?q=' + encodeURIComponent(title); }

function render() {
  const query = document.getElementById('search').value.trim().toLowerCase();
  const filter = document.getElementById('filter').value;
  const sort = document.getElementById('sort').value;
  const watched = getWatched();

  let list = films.slice();
  if (query) {
    list = list.filter(f => f.title.toLowerCase().includes(query) || f.director.toLowerCase().includes(query) || f.country.toLowerCase().includes(query) || f.genre.toLowerCase().includes(query));
  }
  if (filter === 'watched') list = list.filter(f => watched.has(f.rank));
  if (filter === 'unwatched') list = list.filter(f => !watched.has(f.rank));

  if (sort === 'year') list.sort((a, b) => a.year - b.year);
  else if (sort === 'title') list.sort((a, b) => a.title.localeCompare(b.title));
  else list.sort((a, b) => a.rank - b.rank);

  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  if (!list.length) {
    grid.innerHTML = '<div class="empty">No films match your search.</div>';
  }
  list.forEach(f => {
    const isWatched = watched.has(f.rank);
    const el = document.createElement('article');
    el.className = 'card' + (isWatched ? ' watched' : '');
    el.innerHTML = `
      <button class="check-btn" data-rank="${f.rank}" title="Toggle watched" aria-label="Toggle watched">✓</button>
      ${f.poster ? `<img class="poster" src="${f.poster}" alt="" loading="lazy" onerror="this.style.display='none'">` : ''}
      <div class="info">
        <div class="title">#${f.rank} ${f.title}</div>
        <div class="meta"><span>${f.year}</span><span>${f.director}</span><span>${f.country}</span><span>${f.runtime} min</span></div>
        <div class="tags"><span class="tag">${f.genre}</span></div>
        <div class="links">
          <a href="${f.criterion || searchLink(f.title)}" target="_blank" rel="noopener">Criterion</a>
          <a href="${justwatchLink(f.title)}" target="_blank" rel="noopener">Where to watch</a>
        </div>
      </div>
    `;
    grid.appendChild(el);
  });

  document.getElementById('total-count').textContent = films.length;
  document.getElementById('watched-count').textContent = watched.size;
  document.getElementById('remaining-count').textContent = films.length - watched.size;

  document.querySelectorAll('.check-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const rank = Number(btn.dataset.rank);
      const w = getWatched();
      if (w.has(rank)) w.delete(rank); else w.add(rank);
      setWatched(w);
      render();
    });
  });
}

document.getElementById('search').addEventListener('input', render);
document.getElementById('filter').addEventListener('change', render);
document.getElementById('sort').addEventListener('change', render);
document.getElementById('reset').addEventListener('click', () => {
  if (confirm('Clear all watched marks?')) { setWatched(new Set()); render(); }
});

render();
</script>
